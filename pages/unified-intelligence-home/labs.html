<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trulioo Labs</title>
  <link rel="preload" href="fonts/tobias-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/FoundersGrotesk-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/fonts.css?v=2">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="css/tokens.css?v=2">
  <link rel="stylesheet" href="../shared/tds-shared-atoms.css">
  <link rel="stylesheet" href="../../Components/button/button.css">
  <link rel="stylesheet" href="../../Components/text-input/text-input.css">
  <link rel="stylesheet" href="../../Components/action-list-item/action-list-item.css">
  <link rel="stylesheet" href="../../Components/filter-button/filter-button.css">
  <link rel="stylesheet" href="../../Components/counter-label/counter-label.css">
  <link rel="stylesheet" href="css/ds-nav-tokens.css">
  <link rel="stylesheet" href="css/side-nav.css?v=2">
  <link rel="stylesheet" href="css/side-nav-experimental.css?v=3">
  <link rel="stylesheet" href="css/app-shell.css?v=2">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/hero.css?v=2">
  <link rel="stylesheet" href="css/hero-headline.css?v=6">
  <link rel="stylesheet" href="css/labs.css?v=14">
  <link rel="stylesheet" href="css/truai-panel.css?v=4">
  <script src="js/truai-panel.js?v=4" defer></script>
</head>
<body data-sidenav="experimental" data-sidenav-active="home">
<div class="app-shell" id="app-shell">
  <div class="app-sidenav-overlay" id="app-sidenav-overlay" hidden aria-hidden="true"></div>

  <aside class="tds-side-nav tds-side-nav--collapsed" id="app-sidenav" aria-label="Primary">
    <div class="tds-side-nav__header">
      <button type="button" class="tds-side-nav__brand" aria-label="Trulioo home" onclick="window.location.href='labs.html'">
        <span class="tds-side-nav__logo">
          <img src="assets/trulioo-logo-mark.svg" alt="" width="40" height="40">
        </span>
      </button>
    </div>

    <div class="tds-side-nav__main">
      <div class="tds-side-nav__icon-rail" aria-hidden="false">
        <button type="button" class="tds-side-nav__icon-button" aria-label="Home">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 7.5 8 2.5l5.5 5V13a1 1 0 0 1-1 1H10v-4H6v4H3.5a1 1 0 0 1-1-1V7.5z"/></svg>
          <span class="tds-side-nav__tooltip" role="tooltip"><span class="tds-side-nav__tooltip-caret"></span><span class="tds-side-nav__tooltip-body">Home</span></span>
        </button>
      </div>
    </div>

    <div class="tds-side-nav__footer">
      <button type="button" class="tds-side-nav__profile tds-side-nav__profile--collapsed" aria-label="Jane Doe, janedoe@trulioo.com">
        <span class="tds-side-nav__avatar">JD</span>
      </button>
    </div>
  </aside>

  <main class="app-main labs-main">
    <button class="truai-btn" type="button" aria-controls="truaiPanel" aria-expanded="false" aria-label="Open TruAI chat" onclick="window.TruAIPanel && window.TruAIPanel.open()"><span aria-hidden="true">✦</span> TruAI</button>

    <div class="labs-page">
      <section class="hero-zone labs-hero-zone">
        <div class="hero-inner">
          <span class="brand-pill glass-frosted">
            <svg class="labs-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10.6593 0C10.8256 0 10.986 0.0659699 11.1036 0.18359C11.221 0.30117 11.2872 0.46076 11.2872 0.62695C11.2872 0.79313 11.221 0.95272 11.1036 1.07031C10.986 1.18793 10.8256 1.2539 10.6593 1.2539H10.0323V5.71679L14.8692 13.7802H14.8712C14.9853 13.9706 15.0471 14.1882 15.0499 14.4101C15.0526 14.6319 14.9961 14.8508 14.8868 15.0439C14.7776 15.2366 14.6192 15.397 14.4278 15.5087C14.2362 15.6204 14.0178 15.6796 13.796 15.6796H1.25207C1.03035 15.6793 0.812606 15.6197 0.621206 15.5078C0.429926 15.3959 0.271286 15.2357 0.162216 15.0429C0.0531262 14.8498 -0.00277409 14.6308 0.000105914 14.4091C0.00298591 14.1874 0.0647559 13.9704 0.178816 13.7802L5.01476 5.71679V1.2539H4.38781C4.22148 1.2539 4.06207 1.18791 3.94445 1.07031C3.82683 0.95268 3.76085 0.79329 3.76085 0.62695C3.76088 0.46064 3.82685 0.30119 3.94445 0.18359C4.06206 0.0660399 4.22152 0 4.38781 0H10.6593ZM6.26962 1.2539V5.89064C6.26992 6.00414 6.23842 6.11564 6.17982 6.21284L4.26183 9.41404C5.3726 9.45254 6.55962 9.78694 7.80672 10.4179C9.58462 11.3178 10.9226 11.3966 11.8634 11.2109L8.86732 6.21284C8.80872 6.11574 8.77832 6.00404 8.77842 5.89064V1.2539H6.26962Z" fill="currentColor"/></svg>
            Trulioo Labs
          </span>

          <h1 class="hero-title" id="heroTitle">Turn verification signals into actionable risk intelligence.</h1>
          <p class="hero-sub">Assess risk, uncover relationships, investigate signals, and monitor change from a single experience.</p>

          <div class="hero-card glass-frosted labs-search-card">
            <div class="search-row glass-solid" id="labsSearchRow">
              <svg class="search-ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M14 14l3 3" stroke-linecap="round"/></svg>
              <input class="search-input" id="labsSearchInput" type="search" placeholder="Search" autocomplete="off" aria-label="Search experiences">
              <button type="button" class="labs-search-clear" id="labsSearchClear" hidden aria-label="Clear search">
                <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
              </button>
              <div class="tds-filter-button" data-dropdown-align="end" id="labsFilterBar" data-filter-key="filters">
                <button type="button" class="tds-btn tds-btn--md tds-btn--secondary" aria-haspopup="menu" aria-expanded="false">
                  <span class="tds-btn__leading-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg></span>
                  <span class="tds-filter-button__trigger-default">Filter</span>
                  <span class="tds-filter-button__trigger-value"></span>
                  <span class="tds-counter tds-counter--primary tds-counter--sm tds-filter-button__counter" hidden></span>
                  <span class="tds-btn__trailing-icon tds-filter-button__clear" aria-hidden="true"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></span>
                </button>
                <div class="tds-dropdown-panel labs-filter-menu" role="menu" hidden id="labsFilterMenu"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div class="labs-catalog">
        <div class="labs-active-filters" id="labsActiveFilters" hidden aria-label="Active filters"></div>

        <div class="labs-sections">
          <section class="labs-featured" id="labsFeaturedSection" aria-labelledby="labsFeaturedLabel">
            <h2 class="labs-section-label" id="labsFeaturedLabel">Featured</h2>
            <div class="labs-featured-row" id="labsFeaturedRow"></div>
          </section>

          <section class="labs-browse" id="labsBrowseSection" aria-labelledby="labsBrowseTitle">
            <h2 class="labs-section-label" id="labsBrowseTitle">All Experiences</h2>
            <div class="labs-grid" id="labsGrid"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<dialog class="truai-dialog" id="truaiPanel" aria-label="TruAI Chat">
  <div class="truai-panel" id="truaiPanelSurface">
    <div class="truai-panel-bg" aria-hidden="true"></div>
    <div class="truai-panel-inner">
      <header class="truai-panel-head">
        <h2>TruAI Chat</h2>
        <div class="truai-panel-actions">
          <button class="truai-icon-btn" type="button" id="truaiExpand" title="Expand" aria-label="Expand panel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 10V13h3M13 6V3h-3M6 3h3v3M10 13h-3v-3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="truai-icon-btn" type="button" id="truaiClose" title="Close" aria-label="Close TruAI chat"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke-linecap="round"/></svg></button>
        </div>
      </header>
      <div class="truai-messages" id="truaiMessages">
        <div class="truai-msg truai-msg-ai">What do you want to learn with TruAI?</div>
      </div>
      <footer class="truai-chatbar">
        <input class="truai-chat-input" id="truaiInput" type="text" placeholder="Ask TruAI anything…" autocomplete="off" aria-label="Message TruAI">
        <button class="truai-chat-send" type="button" id="truaiSend" aria-label="Send message"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 12V4M5 7l3-3 3 3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </footer>
    </div>
  </div>
</dialog>

<script src="js/hero-headline.js?v=6"></script>
<script src="js/labs-icons.js?v=2"></script>
<script src="js/labs-data.js?v=17"></script>
<script src="../../Components/_shared/dropdown-panel/dropdown-panel.js"></script>
<script src="js/labs.js?v=12"></script>
<script src="../../Components/side-nav/side-nav.js"></script>
<script src="js/side-nav-experimental.js?v=13"></script>
<script>SideNavExperimental.init(); TdsSideNav.init();</script>
</body>
</html>
