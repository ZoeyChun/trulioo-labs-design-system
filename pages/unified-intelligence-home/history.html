</head>
<body data-sidenav="experimental" data-sidenav-active="history">
<div class="app-shell" id="app-shell">
  <div class="app-sidenav-overlay" id="app-sidenav-overlay" hidden aria-hidden="true"></div>

  <aside class="tds-side-nav tds-side-nav--collapsed" id="app-sidenav" aria-label="Primary">
    <div class="tds-side-nav__header">
      <button type="button" class="tds-side-nav__brand" aria-label="Trulioo home" onclick="window.location.href='index.html'">
        <span class="tds-side-nav__logo">
          <img src="assets/trulioo-logo-mark.svg" alt="" width="40" height="40">
        </span>
      </button>
    </div>

    <div class="tds-side-nav__main">
      <div class="tds-side-nav__icon-rail" aria-hidden="false">
        <button type="button" class="tds-side-nav__icon-button" aria-label="Home">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 7.5 8 2.5l5.5 5V13a1 1 0 0 1-1 1H10v-4H6v4H3.5a1 1 0 0 1-1-1V7.5z"/></svg>
          <span class="tds-side-nav__tooltip" role="tooltip"><span class="tds-side-nav__tooltip-caret"></span><span class="tds-side-nav__tooltip-body">Home</span></span>
        </button>
        <button type="button" class="tds-side-nav__icon-button" aria-label="Labs">

4.5693C0.479548 14.3476 0.541318 14.1306 0.655378 13.9404L5.49132 5.87695V1.41406H4.86437C4.69804 1.41406 4.53863 1.34807 4.42101 1.23047C4.30339 1.11284 4.23741 0.953446 4.23741 0.787106C4.23744 0.620796 4.30341 0.461346 4.42101 0.343746C4.53862 0.226196 4.69808 0.160156 4.86437 0.160156H11.1359ZM6.74618 1.41406V6.0508C6.74648 6.1643 6.71498 6.2758 6.65638 6.373L4.73839 9.5742C5.84916 9.6127 7.03618 9.9471 8.28328 10.5781C10.0612 11.478 11.3992 11.5568 12.34 11.3711L9.34388 6.373C9.28528 6.2759 9.25488 6.1642 9.25498 6.0508V1.41406H6.74618Z" fill="white"/></svg>
          <span class="tds-side-nav__tooltip" role="tooltip"><span class="tds-side-nav__tooltip-caret"></span><span class="tds-side-nav__tooltip-body">Labs</span></span>
        </button>
      </div>
    </div>

    <div class="tds-side-nav__footer">
      <button type="button" class="tds-side-nav__profile tds-side-nav__profile--collapsed" aria-label="Jane Doe, janedoe@trulioo.com">
        <span class="tds-side-nav__avatar">JD</span>
      </button>
    </div>
  </aside>

  <main class="app-main history-main">
    <button class="truai-btn" type="button" aria-controls="truaiPanel" aria-expanded="false" aria-label="Open TruAI chat" onclick="window.TruAIPanel && window.TruAIPanel.open()"><span aria-hidden="true">✦</span> TruAI</button>

    <div class="history-page">
      <div class="history-intro">
        <header class="history-hero">
          <h1 class="history-hero__title">Transactions</h1>
          <p class="history-hero__desc">View, search, and review previous AI investigations and verification activities across Trulioo Labs.</p>
        </header>

        <div class="history-stats" aria-label="Transaction summary">
          <div class="history-stats__item">
            <p class="history-stats__label">Signals checked</p>
            <p class="history-stats__value" id="historyStatSignals">2,385</p>
          </div>
          <div class="history-stats__item">
            <p class="history-stats__label">Pass rate</p>
            <p class="history-stats__value" id="historyStatPassRate">87%</p>
          </div>
          <div class="history-stats__item">
            <p class="history-stats__label">Failed checks</p>
            <p class="history-stats__value" id="historyStatFailed">66</p>
          </div>
        </div>
      </div>

      <div class="history-table-block">
        <div class="history-toolbar">
          <div class="tds-text-input history-search">
            <div class="tds-text-input__field tds-text-input__field--md">
              <span class="tds-text-input__leading-icon" aria-hidden="true">
                <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
              </span>
              <input class="tds-text-input__native" id="historySearchInput" type="search" placeholder="Search" autocomplete="off" aria-label="Search transactions">
            </div>
          </div>

          <div class="history-toolbar__actions">
            <div class="tds-date-picker-range tds-date-picker-range--interactive history-date-filter" data-date-picker-range data-size="md" data-view="03/01/2026" id="historyDateRange">
              <div class="tds-date-picker-range__fields">
                <div class="tds-date-picker" data-date-picker-part="start">
                  <button type="button" class="tds-btn tds-btn--md tds-btn--secondary tds-date-picker__field tds-date-picker__field--md history-date-filter__trigger" aria-haspopup="dialog" aria-expanded="false" aria-label="Filter by date">
                    <span class="history-date-filter__label" id="historyDateButtonLabel">Date</span>
                    <span class="tds-date-picker__value tds-date-picker__placeholder visually-hidden">mm/dd/yyyy</span>
                    <span class="tds-caret tds-caret--default history-date-filter__caret" aria-hidden="true">
                      <svg viewBox="0 0 8 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.073724 3.46966L3.4702 0.0732225C3.56783 -0.0244075 3.72612 -0.0244075 3.82375 0.0732225L7.22014 3.46966C7.37764 3.62716 7.26614 3.89644 7.04334 3.89644H0.250504C0.0277738 3.89644 -0.083766 3.62715 0.073724 3.46966Z" fill="currentColor"/><path d="M0.073724 7.32322L3.4702 10.7197C3.56783 10.8173 3.72612 10.8173 3.82375 10.7197L7.22014 7.32322C7.37764 7.16572 7.26614 6.89644 7.04334 6.89644H0.250504C0.0277738 6.89644 -0.083766 7.16573 0.073724 7.32322Z" fill="currentColor"/></svg>
                    </span>
                    <span class="history-date-filter__clear" hidden role="button" tabindex="0" aria-label="Clear date filter">
                      <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                    </span>
                  </button>
                </div>
                <div class="tds-date-picker history-date-filter__end" data-date-picker-part="end">
                  <button type="button" class="tds-date-picker__field tds-date-picker__field--md" aria-haspopup="dialog" aria-expanded="false" tabindex="-1">
                    <span class="tds-date-picker__value tds-date-picker__placeholder">mm/dd/yyyy</span>
                  </button>
                </div>
              </div>
            </div>

            <div class="tds-filter-button" data-dropdown-align="end" id="historyFilterBar" data-filter-key="filters">
              <button type="button" class="tds-btn tds-btn--md tds-btn--secondary" aria-haspopup="menu" aria-expanded="false">
                <span class="tds-btn__leading-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg></span>
                <span class="tds-filter-button__trigger-default">Filter</span>
                <span class="tds-filter-button__trigger-value"></span>
                <span class="tds-counter tds-counter--primary tds-counter--sm tds-filter-button__counter" hidden></span>
                <span class="tds-btn__trailing-icon tds-filter-button__clear" aria-hidden="true"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></span>
              </button>
              <div class="tds-dropdown-panel history-filter-menu" role="menu" hidden id="historyFilterMenu"></div>
            </div>
          </div>
        </div>

        <div class="history-active-filters" id="historyActiveFilters" hidden aria-label="Active filters"></div>

        <div class="tds-data-table-container history-table-card">
          <div class="tds-data-table__wrapper">
            <table class="tds-data-table history-table">
              <colgroup>
                <col class="history-col-transaction">
                <col class="history-col-product">
                <col class="history-col-country">
                <col class="history-col-date">
                <col class="history-col-status">
                <col class="history-col-actions">
              </colgroup>
              <thead id="historyTableHead">
                <tr>
                  <th scope="col" data-sort="transaction" aria-sort="none" tabindex="0"><span class="history-table__sort-label">Transaction <span class="tds-data-table__sort-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.2 6.2h7.6L8 11.4 4.2 6.2z"/></svg></span></span></th>
                  <th scope="col" data-sort="productType" aria-sort="none" tabindex="0"><span class="history-table__sort-label">Product type <span class="tds-data-table__sort-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.2 6.2h7.6L8 11.4 4.2 6.2z"/></svg></span></span></th>
                  <th scope="col" data-sort="country" aria-sort="none" tabindex="0"><span class="history-table__sort-label">Country <span class="tds-data-table__sort-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.2 6.2h7.6L8 11.4 4.2 6.2z"/></svg></span></span></th>
                  <th scope="col" data-sort="date" aria-sort="descending" tabindex="0"><span class="history-table__sort-label">Date <span class="tds-data-table__sort-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.2 6.2h7.6L8 11.4 4.2 6.2z"/></svg></span></span></th>
                  <th scope="col" data-sort="status" aria-sort="none" tabindex="0"><span class="history-table__sort-label">Status <span class="tds-data-table__sort-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.2 6.2h7.6L8 11.4 4.2 6.2z"/></svg></span></span></th>
                  <th scope="col" class="tds-data-table__actions-col"><span class="visually-hidden">Open</span></th>
                </tr>
              </thead>
              <tbody id="historyTableBody"></tbody>
            </table>
          </div>
          <div class="tds-data-table__footer" id="historyTableFooter"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<dialog class="truai-dialog" id="truaiPanel" aria-label="TruAI Chat">
  <div class="truai-panel" id="truaiPanelSurface">
    <div class="truai-panel-bg" aria-hidden="true"></div>
    <div class="truai-panel-inner">
      <header class="truai-panel-head">
        <h2>TruAI Chat</h2>
        <div class="truai-panel-actions">
          <button class="truai-icon-btn" type="button" id="truaiExpand" title="Expand" aria-label="Expand panel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 10V13h3M13 6V3h-3M6 3h3v3M10 13h-3v-3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="truai-icon-btn" type="button" id="truaiClose" title="Close" aria-label="Close TruAI chat"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke-linecap="round"/></svg></button>
        </div>
      </header>
      <div class="truai-messages" id="truaiMessages">
        <div class="truai-msg truai-msg-ai">What do you want to learn with TruAI?</div>
      </div>
      <footer class="truai-chatbar">
        <input class="truai-chat-input" id="truaiInput" type="text" placeholder="Ask TruAI anything…" autocomplete="off" aria-label="Message TruAI">
        <button class="truai-chat-send" type="button" id="truaiSend" aria-label="Send message"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 12V4M5 7l3-3 3 3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </footer>
    </div>
  </div>
</dialog>

<script src="js/history-data.js?v=5"></script>
<script src="../../Components/_shared/dropdown-panel/dropdown-panel.js"></script>
<script src="../../Components/date-picker/date-picker.js"></script>
<script src="js/history.js?v=8"></script>
<script src="js/side-nav-experimental.js?v=2"></script>
<script>SideNavExperimental.init();</script>
</body>
</html>
