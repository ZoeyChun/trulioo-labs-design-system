<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Testing — Trulioo Labs</title>
  <link rel="stylesheet" href="../../tokens/fonts.css">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <style>
    body {
      margin: 0;
      font-family: var(--tds-font-family-sans, "Inter", system-ui, sans-serif);
      color: var(--tds-color-text-primary, #161616);
      background: var(--tds-color-bg-canvas, #f4f4f4);
      padding: 48px 32px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 600;
    }
    p {
      margin: 0 0 32px;
      color: var(--tds-color-text-secondary, #525252);
      max-width: 40rem;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
      max-width: 28rem;
    }
    a {
      display: block;
      padding: 16px 20px;
      background: #fff;
      border: 1px solid var(--tds-color-border-subtle, #e0e0e0);
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      border-color: var(--tds-color-border-strong, #8d8d8d);
    }
    a span {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      font-weight: 400;
      color: var(--tds-color-text-secondary, #525252);
    }
  </style>
</head>
