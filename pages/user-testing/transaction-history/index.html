<body>
  <div class="app-shell" id="app-shell">
    <div class="app-sidenav-overlay" id="app-sidenav-overlay" hidden aria-hidden="true"></div>

    <aside class="tds-side-nav tds-side-nav--collapsed" id="app-sidenav" aria-label="Primary">
      <div class="tds-side-nav__header">
        <button type="button" class="tds-side-nav__brand" aria-label="Trulioo home">
          <span class="tds-side-nav__logo">
            <img src="../../../assets/trulioo-logo-mark.svg" alt="" width="40" height="40">
          </span>
        </button>
      </div>

      <div class="tds-side-nav__main">
        <div class="tds-side-nav__icon-rail" aria-hidden="false">
          <button type="button" class="tds-side-nav__icon-button tds-side-nav__icon-button--active" aria-current="page" aria-label="Home">
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 7.5 8 2.5l5.5 5V13a1 1 0 0 1-1 1H10v-4H6v4H3.5a1 1 0 0 1-1-1V7.5z"/></svg>
            <span class="tds-side-nav__tooltip" role="tooltip"><span class="tds-side-nav__tooltip-caret"></span><span class="tds-side-nav__tooltip-body">Home</span></span>
          </button>
          <button type="button" class="tds-side-nav__icon-button" aria-label="Labs">
            <svg class="icon tds-labs-icon tds-labs-icon--onlight" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.1359 0.160156C11.3022 0.160156 11.4626 0.226126 11.5802 0.343746C11.6976 0.461326 11.7638 0.620916 11.7638 0.787106C11.7638 0.953286 11.6976 1.11288 11.5802 1.23047C11.4626 1.34809 11.3022 1.41406 11.1359 1.41406H10.5089V5.87695L15.3458 13.9404H15.3478C15.4619 14.1308 15.5237 14.3484 15.5265 14.5703C15.5292 14.7921 15.4727 15.011 15.3634 15.2041C15.2542 15.3968 15.0958 15.5572 14.9044 15.6689C14.7128 15.7806 14.4944 15.8398 14.2726 15.8398H1.72863C1.50691 15.8395 1.28917 15.7799 1.09777 15.668C0.906488 15.5561 0.747849 15.3959 0.638779 15.2031C0.529689 15.01 0.473788 14.791 0.476668 14.5693C0.479548 14.3476 0.541318 14.1306 0.655378 13.9404L5.49132 5.87695V1.41406H4.86437C4.69804 1.41406 4.53863 1.34807 4.42101 1.23047C4.30339 1.11284 4.23741 0.953446 4.23741 0.787106C4.23744 0.620796 4.30341 0.461346 4.42101 0.343746C4.53862 0.226196 4.69808 0.160156 4.86437 0.160156H11.1359ZM6.74618 1.41406V6.0508C6.74648 6.1643 6.71498 6.2758 6.65638 6.373L4.73839 9.5742C5.84916 9.6127 7.03618 9.9471 8.28328 10.5781C10.0612 11.478 11.3992 11.5568 12.34 11.3711L9.34388 6.373C9.28528 6.2759 9.25488 6.1642 9.25498 6.0508V1.41406H6.74618Z" fill="currentColor"/></svg>
            <span class="tds-side-nav__tooltip" role="tooltip"><span class="tds-side-nav__tooltip-caret"></span><span class="tds-side-nav__tooltip-body">Labs</span></span>
          </button>
        </div>
      </div>

      <button type="button" class="tds-side-nav__collapse-bar" id="sidenav-collapse" aria-label="Expand sidebar" aria-expanded="false">
        <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 4l4 4-4 4M10 4l4 4-4 4"/></svg>
        <span class="tds-side-nav__collapse-label">Hide Sidebar</span>
      </button>

      <div class="tds-side-nav__footer">
        <button type="button" class="tds-side-nav__profile tds-side-nav__profile--collapsed" aria-label="Jane Doe">
          <span class="tds-side-nav__avatar">JD</span>
        </button>
      </div>
    </aside>

    <main class="ut-tx-main" id="main">
      <div class="ut-tx-main__scroll">
      <div class="ut-tx-page">
        <header class="ut-tx-header">
          <div class="ut-tx-header__title-row">
            <h1 class="ut-tx-header__title">Transactions</h1>
          </div>
        </header>

        <div class="ut-tx-block">
          <div class="ut-tx-toolbar">
            <div class="ut-tx-toolbar__left">
              <div class="tds-text-input ut-tx-search">
                <div class="tds-text-input__field tds-text-input__field--lg">
                  <input class="tds-text-input__native" id="utTxSearch" type="search" placeholder="Search by name, country or ID" autocomplete="off" aria-label="Search by name, country or ID">
                  <button type="button" class="ut-tx-search__clear" id="utTxSearchClear" hidden aria-label="Clear search">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                  </button>
                  <button type="button" class="tds-icon-btn tds-icon-btn--primary tds-icon-btn--sm ut-tx-search__submit" aria-label="Search">
                    <span class="tds-icon-btn__icon" aria-hidden="true">
                      <svg class="icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.25"/><path d="M10.5 10.5 13.5 13.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
                    </span>
                  </button>
                </div>
              </div>

              <div class="tds-date-picker-range tds-date-picker-range--interactive ut-tx-date" data-date-picker-range data-size="lg" data-view="03/16/2026" id="utTxDateWrap">
                <div class="tds-date-picker-range__fields">
                  <div class="tds-date-picker" data-date-picker-part="start">
                    <button type="button" class="tds-date-picker__field tds-date-picker__field--lg" aria-haspopup="dialog" aria-expanded="false" aria-label="Filter by date">
                      <span class="tds-date-picker__icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.25"/><path d="M2 6.5h12M5.5 1.75V4M10.5 1.75V4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg></span>
                      <span class="tds-date-picker__value tds-date-picker__placeholder visually-hidden">mm/dd/yyyy</span>
                      <span class="ut-tx-date__label tds-date-picker__placeholder">mm/dd/yyyy</span>
                      <span class="ut-tx-date__clear" hidden role="button" tabindex="0" aria-label="Clear date">
                        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                      </span>
                    </button>
                  </div>
                  <div class="tds-date-picker ut-tx-date__end" data-date-picker-part="end">
                    <button type="button" class="tds-date-picker__field tds-date-picker__field--lg" aria-haspopup="dialog" aria-expanded="false" tabindex="-1" aria-label="End date">
                      <span class="tds-date-picker__value tds-date-picker__placeholder">mm/dd/yyyy</span>
                    </button>
                  </div>
                </div>
              </div>

              <div class="tds-text-input ut-tx-product" id="utTxProductWrap" hidden>
                <div class="tds-text-input__field tds-text-input__field--lg">
                  <select class="tds-text-input__native ut-tx-product__select" id="utTxProduct" aria-label="Filter by product">
                    <option value="" selected>Product</option>
                  </select>
                  <span class="tds-caret tds-caret--default" aria-hidden="true">
                    <svg viewBox="0 0 8 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.073724 3.46966L3.4702 0.0732225C3.56783 -0.0244075 3.72612 -0.0244075 3.82375 0.0732225L7.22014 3.46966C7.37764 3.62716 7.26614 3.89644 7.04334 3.89644H0.250504C0.0277738 3.89644 -0.083766 3.62715 0.073724 3.46966Z" fill="currentColor"/><path d="M0.073724 7.32322L3.4702 10.7197C3.56783 10.8173 3.72612 10.8173 3.82375 10.7197L7.22014 7.32322C7.37764 7.16572 7.26614 6.89644 7.04334 6.89644H0.250504C0.0277738 6.89644 -0.083766 7.16573 0.073724 7.32322Z" fill="currentColor"/></svg>
                  </span>
                </div>
              </div>

              <button type="button" class="tds-btn tds-btn--sm tds-btn--invisible ut-tx-toolbar-reset" id="utTxToolbarReset" hidden>Reset</button>
            </div>

            <div class="tds-filter-button" id="utTxFilter">
              <button type="button" class="tds-btn tds-btn--md tds-btn--secondary" id="utTxFilterBtn" aria-haspopup="dialog" aria-controls="utTxFilters" aria-expanded="false">
                <span class="tds-btn__leading-icon" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg>
                </span>
                <span class="tds-filter-button__trigger-default">Filter</span>
                <span class="tds-counter tds-counter--primary tds-counter--sm tds-filter-button__counter" id="utTxFilterCount" hidden>0</span>
              </button>
            </div>
          </div>

          <div class="ut-tx-table-section">
            <p class="ut-tx-search-status" id="utTxSearchStatus" hidden></p>
            <div class="tds-data-table-container ut-tx-table-card">
              <div class="tds-data-table__wrapper">
                <table class="tds-data-table ut-tx-table">
                  <colgroup id="utTxCols"></colgroup>
                  <thead id="utTxHead"></thead>
                  <tbody id="utTxBody"></tbody>
                </table>
              </div>

              <div class="tds-data-table__footer" id="utTxFooter"></div>
            </div>
          </div>
        </div>
      </div>
      </div>
    </main>

    <button type="button" class="ut-tx-test-settings" id="utTxSettingsBtn" aria-haspopup="dialog" aria-controls="utTxSettings" aria-expanded="false">Test settings</button>

    <aside class="ut-tx-settings" id="utTxSettings" role="dialog" aria-modal="false" aria-labelledby="utTxSettingsTitle" aria-hidden="true" hidden>
      <header class="ut-tx-settings__header">
        <h2 class="ut-tx-settings__title" id="utTxSettingsTitle">Settings</h2>
        <button type="button" class="tds-icon-btn tds-icon-btn--secondary tds-icon-btn--sm ut-tx-settings__close" aria-label="Close settings">
          <span class="tds-icon-btn__icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4 4 12"/></svg>
          </span>
        </button>
      </header>

      <div class="ut-tx-settings__body">
        <section class="ut-tx-settings__section" aria-labelledby="utSetToolbar">
          <h3 class="ut-tx-settings__heading" id="utSetToolbar">Filters</h3>
          <div class="ut-tx-settings__radios" role="radiogroup" aria-labelledby="utSetToolbar">
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-toolbar" value="only-date" checked> <span>Only Date</span></label>
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-toolbar" value="only-product"> <span>Only Product</span></label>
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-toolbar" value="date-and-product"> <span>Date and Product</span></label>
          </div>
        </section>

        <section class="ut-tx-settings__section" aria-labelledby="utSetTransaction">
          <h3 class="ut-tx-settings__heading" id="utSetTransaction">Transaction</h3>
          <div class="ut-tx-settings__radios" role="radiogroup" aria-labelledby="utSetTransaction">
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-transaction" value="name-only" checked> <span>Name only</span></label>
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-transaction" value="name-additional"> <span>Name + additional information</span></label>
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-transaction" value="name-trid"> <span>Name + transaction ID</span></label>
          </div>
        </section>

        <section class="ut-tx-settings__section" aria-labelledby="utSetTrid">
          <h3 class="ut-tx-settings__heading" id="utSetTrid">Transaction ID</h3>
          <div class="ut-tx-settings__radios" role="radiogroup" aria-labelledby="utSetTrid">
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-transactionId" value="copy-trid-column"> <span>Copy TRID column</span></label>
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-transactionId" value="copy-under-menu" checked> <span>Copy under additional (…) menu</span></label>
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-transactionId" value="copy-icon"> <span>Copy icon</span></label>
          </div>
        </section>

        <section class="ut-tx-settings__section" aria-labelledby="utSetStatus">
          <h3 class="ut-tx-settings__heading" id="utSetStatus">Status</h3>
          <div class="ut-tx-settings__radios" role="radiogroup" aria-labelledby="utSetStatus">
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-status" value="combined-outcome" checked> <span>Combined with Outcome</span></label>
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-status" value="status-icons"> <span>Status as icons</span></label>
          </div>
        </section>

        <section class="ut-tx-settings__section" aria-labelledby="utSetDate">
          <h3 class="ut-tx-settings__heading" id="utSetDate">Date</h3>
          <div class="ut-tx-settings__radios" role="radiogroup" aria-labelledby="utSetDate">
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-date" value="long" checked> <span>12 Mar 2026, 10:00</span></label>
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-date" value="numeric"> <span>03/12/2026, 22:00</span></label>
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-date" value="double-line"> <span>Double-line</span></label>
          </div>
        </section>

        <section class="ut-tx-settings__section" aria-labelledby="utSetCountry">
          <h3 class="ut-tx-settings__heading" id="utSetCountry">Country</h3>
          <div class="ut-tx-settings__radios" role="radiogroup" aria-labelledby="utSetCountry">
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-country" value="flag-name" checked> <span>Flag + name</span></label>
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-country" value="flag-only"> <span>Flag only</span></label>
          </div>
        </section>

        <section class="ut-tx-settings__section" aria-labelledby="utSetScore">
          <h3 class="ut-tx-settings__heading" id="utSetScore">Score</h3>
          <div class="ut-tx-settings__radios" role="radiogroup" aria-labelledby="utSetScore">
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-score" value="separate-column" checked> <span>Separate column</span></label>
            <label class="ut-tx-settings__option"><input type="radio" class="tds-radio" name="ut-set-score" value="combined-outcome"> <span>Combined with Outcome</span></label>
          </div>
        </section>
      </div>
    </aside>

    <!-- Figma 301:48285 — Filters drawer (container scroll) -->
    <aside class="ut-tx-filters" id="utTxFilters" role="dialog" aria-modal="false" aria-labelledby="utTxFiltersTitle" aria-hidden="true" hidden>
      <header class="ut-tx-filters__header">
        <h2 class="ut-tx-filters__title" id="utTxFiltersTitle">Filters</h2>
        <div class="ut-tx-filters__header-actions">
          <button type="button" class="tds-btn tds-btn--sm tds-btn--invisible ut-tx-filters__clear" id="utTxFiltersClear" disabled>Clear all</button>
          <button type="button" class="tds-icon-btn tds-icon-btn--secondary tds-icon-btn--sm ut-tx-filters__close" aria-label="Close filters">
            <span class="tds-icon-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4 4 12"/></svg>
            </span>
          </button>
        </div>
      </header>

      <div class="ut-tx-filters__body">
        <div class="ut-tx-filters__body-inner">
        <section class="ut-tx-filters__section" aria-labelledby="utFiltOutcome">
          <h3 class="ut-tx-filters__heading" id="utFiltOutcome">Outcome</h3>
          <div class="ut-tx-filters__options">
            <label class="ut-tx-filters__option">
              <input class="tds-checkbox" type="checkbox" name="ut-filt-outcome" value="positive">
              <span class="ut-tx-filters__option-text">
                <span class="ut-tx-filters__option-label ut-tx-filters__option-label--positive">Positive</span>
                <span class="ut-tx-filters__option-desc">Verified, No Hits Found</span>
              </span>
            </label>
            <label class="ut-tx-filters__option">
              <input class="tds-checkbox" type="checkbox" name="ut-filt-outcome" value="intermediate">
              <span class="ut-tx-filters__option-text">
                <span class="ut-tx-filters__option-label ut-tx-filters__option-label--intermediate">Indeterminate</span>
                <span class="ut-tx-filters__option-desc">Review, Pending Review, In Progress</span>
              </span>
            </label>
            <label class="ut-tx-filters__option">
              <input class="tds-checkbox" type="checkbox" name="ut-filt-outcome" value="negative">
              <span class="ut-tx-filters__option-text">
                <span class="ut-tx-filters__option-label ut-tx-filters__option-label--negative">Negative</span>
                <span class="ut-tx-filters__option-desc">Not Verified, Hits Found</span>
              </span>
            </label>
            <label class="ut-tx-filters__option">
              <input class="tds-checkbox" type="checkbox" name="ut-filt-outcome" value="not-completed">
              <span class="ut-tx-filters__option-text">
                <span class="ut-tx-filters__option-label">Not Completed</span>
                <span class="ut-tx-filters__option-desc">Abandoned, Timed Out, Failed, Not Started</span>
              </span>
            </label>
          </div>
        </section>

        <section class="ut-tx-filters__section" aria-labelledby="utFiltProduct">
          <h3 class="ut-tx-filters__heading" id="utFiltProduct">Product</h3>
          <div class="ut-tx-filters__options" id="utFiltProductOptions"></div>
        </section>

        <section class="ut-tx-filters__section" aria-labelledby="utFiltCountry">
          <h3 class="ut-tx-filters__heading" id="utFiltCountry">Country</h3>
          <div class="tds-text-input ut-tx-filters__select">
            <div class="tds-text-input__field tds-text-input__field--md">
              <span class="tds-text-input__leading-icon" aria-hidden="true">
                <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.25"/><path d="M10.5 10.5 13.5 13.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
              </span>
              <select class="ut-tx-filters__select-native" id="utFiltCountrySelect" aria-label="Select Country" required>
                <option value="" selected disabled>Select Country</option>
              </select>
              <span class="tds-caret tds-caret--default" aria-hidden="true">
                <svg viewBox="0 0 8 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.073724 3.46966L3.4702 0.0732225C3.56783 -0.0244075 3.72612 -0.0244075 3.82375 0.0732225L7.22014 3.46966C7.37764 3.62716 7.26614 3.89644 7.04334 3.89644H0.250504C0.0277738 3.89644 -0.083766 3.62715 0.073724 3.46966Z" fill="currentColor"/><path d="M0.073724 7.32322L3.4702 10.7197C3.56783 10.8173 3.72612 10.8173 3.82375 10.7197L7.22014 7.32322C7.37764 7.16572 7.26614 6.89644 7.04334 6.89644H0.250504C0.0277738 6.89644 -0.083766 7.16573 0.073724 7.32322Z" fill="currentColor"/></svg>
              </span>
            </div>
          </div>
        </section>

        <section class="ut-tx-filters__section" aria-labelledby="utFiltRisk">
          <h3 class="ut-tx-filters__heading" id="utFiltRisk">Risk</h3>
          <div class="ut-tx-filters__options">
            <label class="ut-tx-filters__option"><input class="tds-checkbox" type="checkbox" name="ut-filt-risk" value="high"><span class="ut-tx-filters__option-text"><span class="ut-tx-filters__option-label ut-tx-filters__option-label--regular">High Risk</span></span></label>
            <label class="ut-tx-filters__option"><input class="tds-checkbox" type="checkbox" name="ut-filt-risk" value="medium"><span class="ut-tx-filters__option-text"><span class="ut-tx-filters__option-label ut-tx-filters__option-label--regular">Medium Risk</span></span></label>
