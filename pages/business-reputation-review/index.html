<!-- Static reference implementation — visual spec only. Demo form before KYB Results; wire up real search logic in your own app. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Reputation Review — Trulioo Labs</title>

  <link rel="preload" href="../../tokens/fonts/inter/inter-latin.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="../../tokens/fonts.css">
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="../shared/tds-shared-atoms.css">

  <link rel="stylesheet" href="../../Components/button/button.css">
  <link rel="stylesheet" href="../../Components/text-input/text-input.css">
  <link rel="stylesheet" href="../../Components/action-list-item/action-list-item.css">
  <link rel="stylesheet" href="../../Components/select/select.css">
  <link rel="stylesheet" href="../../Components/select/combobox.css">
  <link rel="stylesheet" href="../../Components/_shared/dropdown-panel/dropdown-panel.css">
  <link rel="stylesheet" href="../../Components/side-nav/side-nav.css">

  <link rel="stylesheet" href="../../assets/flag-icons/css/flag-icons.min.css">
  <link rel="stylesheet" href="../shared/flag-icons.css">
  <link rel="stylesheet" href="../shared/app-shell.css?v=2">
  <link rel="stylesheet" href="../unified-intelligence-home/css/side-nav-experimental.css?v=3">
  <link rel="stylesheet" href="../../Components/ai-tag/ai-tag.css">
  <link rel="stylesheet" href="../shared/truai-chat.css?v=2">
  <link rel="stylesheet" href="../document-verification/document-verification-flow.css">
  <link rel="stylesheet" href="business-reputation-review.css">
  <style>
    button.tds-side-nav__nav-item,
    .tds-side-nav__nav-item {
      height: 40px;
      min-height: 40px;
      padding: var(--padding-xs) var(--padding-sm);
      border-radius: var(--radius-lg);
    }

    .tds-side-nav__nav-item-label {
      justify-content: flex-start;
    }
  </style>
</head>
<body data-sidenav="experimental">

<div class="labs-kyb-layout" id="labs-kyb-layout">

  <div class="app-shell" id="app-shell">

    <div class="app-sidenav-overlay" id="app-sidenav-overlay" hidden aria-hidden="true"></div>

    <aside class="tds-side-nav tds-side-nav--collapsed" id="app-sidenav" aria-label="Primary">
      <div class="tds-side-nav__header">
        <button type="button" class="tds-side-nav__brand" aria-label="Trulioo home">
          <span class="tds-side-nav__logo">
            <img src="../../assets/trulioo-logo-mark.svg" alt="" width="40" height="40">
          </span>
          <span class="tds-side-nav__brand-expanded">
            <span class="tds-side-nav__brand-logo">
              <img src="../../assets/trulioo-labs-logo.svg" alt="Trulioo Labs" width="152" height="24">
            </span>
          </span>
        </button>
      </div>

      <div class="tds-side-nav__main">
        <div class="tds-side-nav__nav-stack"></div>
        <div class="tds-side-nav__icon-rail" aria-hidden="false"></div>
      </div>

      <div class="tds-side-nav__footer">
        <button type="button" class="tds-side-nav__profile tds-side-nav__profile--collapsed" aria-label="Jane Doe, janedoe@trulioo.com">
          <span class="tds-side-nav__avatar">JD</span>
        </button>
      </div>
    </aside>

    <main class="app-main kyb-panel">

      <button type="button" class="app-nav-toggle" id="app-nav-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="app-sidenav">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M3 5h14M3 10h14M3 15h14"/>
        </svg>
      </button>

      <div class="dv-view dv-flow-view" id="brr-form-view">

        <header class="dv-flow-header">
          <div class="dv-flow-header__title-group">
            <button type="button" class="dv-back-btn" id="brr-home-back" aria-label="Back">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
            </button>
            <h1 class="dv-flow-header__title">Business reputation review</h1>
          </div>
          <button class="dv-flow-truai-btn" type="button" data-truai-toggle aria-expanded="false">
            <span class="dv-flow-truai-btn__icon">
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 1l1.5 3.9 3.9 1.5-3.9 1.5L8 11.8 6.5 7.9 2.6 6.4l3.9-1.5L8 1z"/>
                <path d="M12.8 10.2l.7 1.7 1.7.7-1.7.7-.7 1.7-.7-1.7-1.7-.7 1.7-.7.7-1.7z"/>
              </svg>
            </span>
            TruAI
          </button>
        </header>

        <div class="dv-flow-content">

          <section class="dv-flow-step brr-form-step" aria-label="Business search">
            <div class="dv-flow-card brr-form-card" id="brr-form-card">
              <div class="dv-flow-card__header brr-form-card__header">
                <h2 class="dv-flow-card__title" id="brr-card-title">Business search</h2>
              </div>

              <div class="brr-form-card__body">
                <div class="dv-flow-section__label">Business name</div>
                <div class="brr-form-card__field">
                  <div class="brr-search-field" id="brr-search-field">
                    <div class="tds-select tds-select--interactive brr-search-country" id="brr-country-select" data-menu-type="flag">
                      <button type="button" class="tds-select__trigger tds-select__trigger--lg" id="brr-country-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Country, United Kingdom">
                        <span class="tds-select__country-flag" id="brr-country-flag" aria-hidden="true"><span class="fi fi-gb"></span></span>
                        <span class="tds-select__value brr-search-country__value">United Kingdom</span>
                        <span class="tds-select__trailing-group">
                          <span class="tds-caret tds-caret--default" aria-hidden="true">
                            <svg viewBox="0 0 8 11" fill="currentColor"><path d="M4 0l3.5 4h-7L4 0z"/><path d="M4 11L.5 7h7L4 11z"/></svg>
                          </span>
                        </span>
                      </button>
                      <div class="tds-select__menu" role="listbox" aria-label="Country" hidden>
                        <div class="tds-dropdown-panel brr-search-country__menu">
                          <div class="tds-action-list-item tds-action-list-item--selected" role="option" data-value="United Kingdom" data-country-code="gb">
                            <span class="tds-action-list-item__leading-visual" aria-hidden="true"><span class="fi fi-gb"></span></span>
                            <span class="tds-action-list-item__label">United Kingdom</span>
                          </div>
                          <div class="tds-action-list-item" role="option" data-value="United States" data-country-code="us">
                            <span class="tds-action-list-item__leading-visual" aria-hidden="true"><span class="fi fi-us"></span></span>
                            <span class="tds-action-list-item__label">United States</span>
                          </div>
                          <div class="tds-action-list-item" role="option" data-value="Canada" data-country-code="ca">
                            <span class="tds-action-list-item__leading-visual" aria-hidden="true"><span class="fi fi-ca"></span></span>
                            <span class="tds-action-list-item__label">Canada</span>
                          </div>
                          <div class="tds-action-list-item" role="option" data-value="Australia" data-country-code="au">
                            <span class="tds-action-list-item__leading-visual" aria-hidden="true"><span class="fi fi-au"></span></span>
                            <span class="tds-action-list-item__label">Australia</span>
                          </div>
                          <div class="tds-action-list-item" role="option" data-value="Germany" data-country-code="de">
                            <span class="tds-action-list-item__leading-visual" aria-hidden="true"><span class="fi fi-de"></span></span>
                            <span class="tds-action-list-item__label">Germany</span>
                          </div>
                          <div class="tds-action-list-item" role="option" data-value="Netherlands" data-country-code="nl">
                            <span class="tds-action-list-item__leading-visual" aria-hidden="true"><span class="fi fi-nl"></span></span>
                            <span class="tds-action-list-item__label">Netherlands</span>
                          </div>
                          <div class="tds-action-list-item" role="option" data-value="Singapore" data-country-code="sg">
                            <span class="tds-action-list-item__leading-visual" aria-hidden="true"><span class="fi fi-sg"></span></span>
                            <span class="tds-action-list-item__label">Singapore</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="brr-search-field__divider" aria-hidden="true"></div>

                    <div class="tds-combobox tds-combobox--full-width brr-search" id="brr-search">
                      <div class="tds-combobox__field tds-combobox__field--lg brr-search__field">
                        <span class="tds-combobox__leading-visual brr-search__icon" aria-hidden="true">
                          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
                        </span>
                        <input class="tds-combobox__input" id="brr-business-name" type="text" placeholder="Search for United Kingdom business" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="brr-search-list" aria-autocomplete="list" aria-describedby="brr-search-hint" aria-labelledby="brr-card-title">
                      </div>
                      <div class="tds-combobox__menu">
                        <div class="tds-dropdown-panel brr-search__panel" id="brr-search-list" role="listbox" hidden>
                          <div class="brr-search__options" id="brr-search-options"></div>
                          <div class="brr-search__footer" id="brr-search-footer" hidden></div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <p class="brr-search-hint" id="brr-search-hint">Enter at least 3 characters to search for a business.</p>
                </div>
              </div>

              <div class="brr-prefill" id="brr-prefill" hidden>
                <div class="brr-prefill__badge" aria-hidden="true">
                  <span>Pre-filled</span>
                  <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 6l2.2 2.2L9.5 3.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>

                <div class="brr-prefill__grid">
                  <div class="tds-text-input tds-text-input--success">
                    <label class="tds-field-label">BRN</label>
                    <div class="tds-text-input__field tds-text-input__field--lg">
                      <input class="tds-text-input__native" id="brr-prefill-brn" type="text" readonly tabindex="-1" value="11876542">
                    </div>
                    <span class="tds-field-validation tds-field-validation--success">
                      <span class="tds-field-validation__icon" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 6l2.2 2.2L9.5 3.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                      <span>Pre-filled</span>
                    </span>
                  </div>

                  <div class="tds-text-input tds-text-input--success">
                    <label class="tds-field-label">State / Province</label>
                    <div class="tds-text-input__field tds-text-input__field--lg">
                      <input class="tds-text-input__native" id="brr-prefill-state" type="text" readonly tabindex="-1" value="England">
                    </div>
                    <span class="tds-field-validation tds-field-validation--success">
                      <span class="tds-field-validation__icon" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 6l2.2 2.2L9.5 3.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                      <span>Pre-filled</span>
                    </span>
                  </div>

                  <div class="tds-text-input tds-text-input--success brr-prefill__field--full">
                    <label class="tds-field-label">Address</label>
                    <div class="tds-text-input__field tds-text-input__field--lg">
                      <input class="tds-text-input__native" id="brr-prefill-address" type="text" readonly tabindex="-1" value="Suite 4, 123 Formation House">
                    </div>
                    <span class="tds-field-validation tds-field-validation--success">
                      <span class="tds-field-validation__icon" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 6l2.2 2.2L9.5 3.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                      <span>Pre-filled</span>
                    </span>
                  </div>

                  <div class="tds-text-input tds-text-input--success">
                    <label class="tds-field-label">City</label>
                    <div class="tds-text-input__field tds-text-input__field--lg">
                      <input class="tds-text-input__native" id="brr-prefill-city" type="text" readonly tabindex="-1" value="London">
                    </div>
                    <span class="tds-field-validation tds-field-validation--success">
                      <span class="tds-field-validation__icon" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 6l2.2 2.2L9.5 3.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                      <span>Pre-filled</span>
                    </span>
                  </div>

                  <div class="tds-text-input tds-text-input--success">
                    <label class="tds-field-label">Postal code</label>
                    <div class="tds-text-input__field tds-text-input__field--lg">
                      <input class="tds-text-input__native" id="brr-prefill-postal" type="text" readonly tabindex="-1" value="EC2A 4NE">
                    </div>
                    <span class="tds-field-validation tds-field-validation--success">
                      <span class="tds-field-validation__icon" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 6l2.2 2.2L9.5 3.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                      <span>Pre-filled</span>
                    </span>
                  </div>
                </div>
              </div>

              <div class="dv-flow-card__footer">
                <button class="tds-btn tds-btn--secondary tds-btn--lg" type="button" id="brr-back-btn">Back</button>
                <button class="tds-btn tds-btn--primary tds-btn--lg" type="button" id="brr-submit-btn" aria-disabled="true">Submit</button>
              </div>
            </div>
          </section>

        </div>
      </div>

    </main>
  </div>
</div>

<script src="../../Components/_shared/dropdown-panel/dropdown-panel.js"></script>
<script src="../shared/tds-interactive-select.js"></script>
<script src="../shared/labs-history-return.js"></script>
<script src="business-reputation-review.js"></script>
<script src="../shared/truai-chat.js?v=1"></script>
<script src="../../Components/side-nav/side-nav.js"></script>
<script src="../unified-intelligence-home/js/labs-icons.js?v=1"></script>
<script src="../unified-intelligence-home/js/side-nav-experimental.js?v=11"></script>
<script src="../shared/labs-landing-nav.js?v=5"></script>
<script>TdsSideNav.init();</script>
</body>
</html>
