<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ING — Sign in</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: "Segoe UI", Arial, "Helvetica Neue", Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
  }

  /* ---------- Phone frame ---------- */
  .phone {
    width: 390px;
    height: 800px;
    background: #0d0d0f;
    border-radius: 54px;
    padding: 12px;
    position: relative;
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 42px;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    -webkit-overflow-scrolling: touch;
  }

  .screen::-webkit-scrollbar { width: 0; }

  /* Status bar spacer */
  .status-bar {
    height: 44px;
  }

  /* Notch */
  .notch {
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 30px;
    background: #0d0d0f;
    border-radius: 0 0 16px 16px;
    z-index: 20;
  }

  /* ---------- Login content ---------- */
  .login {
    padding: 6px 30px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: calc(100% - 44px);
  }

  .info-row {
    width: 100%;
    display: flex;
    justify-content: flex-end;
  }

  .info-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ff6200;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
  }

  .login-title {
    font-size: 21px;
    font-weight: 700;
    color: #1a1a1a;
    margin-top: 40px;
    text-align: center;
  }

  /* PIN dots */
  .pin-dots {
    display: flex;
    gap: 24px;
    margin-top: 62px;
    margin-bottom: 6px;
  }

  .pin-dots .dot {
    width: 18px;
    height: 18px;
    border: 2px solid #ff6200;
    border-radius: 50%;
    box-sizing: border-box;
  }

  .pin-dots .dot.filled { background: #ff6200; }

  /* Keypad */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    width: 100%;
    max-width: 300px;
    row-gap: 20px;
    margin-top: 64px;
  }

  .key {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    min-height: 58px;
  }

  .key .num {
    font-size: 40px;
    font-weight: 400;
    color: #ff6200;
    line-height: 1;
  }

  .key .letters {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #4d4d4d;
    margin-top: 4px;
    padding-left: 3px;
  }

  .key .icon { color: #ff6200; display: flex; }
  .key .icon svg { display: block; }

  html.preview,
  html.preview * {
    cursor: default !important;
    pointer-events: none !important;
  }

  html.preview {
    height: 800px;
    overflow: hidden;
  }

  html.preview body {
    padding: 0;
    margin: 0;
    width: 390px;
    height: 800px;
    min-height: 800px;
    max-height: 800px;
    overflow: hidden;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  html.preview .phone {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: 12px;
    box-sizing: border-box;
  }

  html.preview .screen {
    flex: 1;
    min-height: 0;
    width: 100%;
    height: auto;
  }
</style>
<script>
  if (window.self !== window.top) {
    document.documentElement.classList.add("preview");
  }
</script>
</head>
<body>
 <div class="phone">
  <div class="notch"></div>
  <div class="screen">

   <!-- Status bar spacer (notch clearance) -->
   <div class="status-bar"></div>

   <!-- ===== Login ===== -->
   <div class="login">

     <div class="info-row">
       <div class="info-btn">i</div>
     </div>

     <div class="login-title">Please sign in to continue</div>

     <!-- PIN correctly entered — all dots filled -->
     <div class="pin-dots">
       <span class="dot filled"></span>
       <span class="dot filled"></span>
       <span class="dot filled"></span>
       <span class="dot filled"></span>
       <span class="dot filled"></span>
     </div>

     <div class="keypad">
       <div class="key"><span class="num">1</span></div>
       <div class="key"><span class="num">2</span><span class="letters">ABC</span></div>
       <div class="key"><span class="num">3</span><span class="letters">DEF</span></div>

       <div class="key"><span class="num">4</span><span class="letters">GHI</span></div>
       <div class="key"><span class="num">5</span><span class="letters">JKL</span></div>
       <div class="key"><span class="num">6</span><span class="letters">MNO</span></div>

       <div class="key"><span class="num">7</span><span class="letters">PQRS</span></div>
       <div class="key"><span class="num">8</span><span class="letters">TUV</span></div>
       <div class="key"><span class="num">9</span><span class="letters">WXYZ</span></div>

       <!-- Face ID -->
       <div class="key">
         <span class="icon">
           <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#ff6200" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
             <path d="M6 13 V9 a3 3 0 0 1 3-3 h4"/>
             <path d="M34 13 V9 a3 3 0 0 0-3-3 h-4"/>
             <path d="M6 27 v4 a3 3 0 0 0 3 3 h4"/>
             <path d="M34 27 v4 a3 3 0 0 1-3 3 h-4"/>
             <line x1="14" y1="16" x2="14" y2="20"/>
             <line x1="26" y1="16" x2="26" y2="20"/>
             <path d="M20 15 v6 l-2 1.5"/>
             <path d="M15 26 c2.5 2.5 7.5 2.5 10 0"/>
           </svg>
         </span>
       </div>

       <div class="key"><span class="num">0</span></div>

       <!-- Backspace -->
       <div class="key">
         <span class="icon">
           <svg width="42" height="34" viewBox="0 0 42 34" fill="none" stroke="#ff6200" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
             <path d="M15 4 h22 a3 3 0 0 1 3 3 v20 a3 3 0 0 1-3 3 H15 L3 17 Z"/>
             <line x1="22" y1="12" x2="32" y2="22"/>
             <line x1="32" y1="12" x2="22" y2="22"/>
           </svg>
         </span>
       </div>
     </div>

   </div>
  </div><!-- .screen -->
 </div><!-- .phone -->
</body>
</html>
