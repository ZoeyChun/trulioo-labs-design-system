<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Italy — SPID Access with Phone Overlay</title>
<link rel="stylesheet" href="embed-mockup.css?v=noscroll-1">
<link rel="stylesheet" href="../../../Components/tap-indicator/tap-indicator.css?v=tap-cue-12">
<script src="../../../Components/tap-indicator/tap-indicator.js?v=tap-cue-5"></script>
<script src="eid-embed-tap.js?v=cursor-1"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html.preview:not(.eid-embed--interactive),
  html.preview:not(.eid-embed--interactive) * {
    cursor: default !important;
    pointer-events: none !important;
    user-select: none;
  }

  body {
    background: transparent;
    font-family: -apple-system, "Segoe UI", Arial, "Helvetica Neue", Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
  }

  /* Stack matches embed viewport — base layer supplies the phone mockup */
  .stack {
    position: relative;
    width: 390px;
    height: 800px;
    flex-shrink: 0;
    overflow: hidden;
  }

  .stack__base,
  .stack__overlay {
    position: absolute;
    border: 0;
    overflow: hidden;
  }

  .stack__base {
    top: 0;
    left: 0;
    width: 390px;
    height: 800px;
  }

  /* Overlay aligns to IT-access .screen inset (12px padding, 42px radius) */
  .stack__overlay {
    top: 12px;
    left: 12px;
    width: 366px;
    height: 776px;
    z-index: 2;
    border-radius: 42px;
    overflow: hidden;
  }

  html.preview {
    height: 800px;
    overflow: hidden;
  }

  html.preview body {
    padding: 0;
    margin: 0;
    width: 390px;
    height: 800px;
    min-height: 800px;
    max-height: 800px;
    overflow: hidden;
    background: transparent;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
  }

  html.preview .stack {
    flex: 1;
    width: 100%;
    height: 100%;
  }

  html.eid-embed--interactive .stack__overlay {
    pointer-events: auto;
  }

  html.eid-embed--interactive .stack__base {
    pointer-events: none;
  }
</style>
<script>
  EidEmbedTap.initInteractive();
</script>
</head>
<body>
  <div class="stack">
    <iframe class="stack__base" src="IT-access.html" title="Italy SPID access" tabindex="-1" scrolling="no"></iframe>
    <iframe class="stack__overlay" src="IT-phone.html?interactive=1" title="Italy SPID phone authorization" scrolling="no"></iframe>
  </div>

<script>
  (function () {
    EidEmbedTap.initInteractive();
    EidEmbedTap.forwardEmbedMessages();
  })();
</script>
</body>
</html>
