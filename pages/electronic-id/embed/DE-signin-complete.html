<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Denmark — MitID Sign in complete</title>
<link rel="stylesheet" href="embed-mockup.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html,
  html * {
    cursor: default !important;
    pointer-events: none !important;
    user-select: none;
  }

  body {
    background: transparent;
    font-family: -apple-system, "Segoe UI", Arial, "Helvetica Neue", Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
  }

  /* ---------- Phone frame ---------- */
  .phone {
    width: 390px;
    height: 800px;
    background: #0d0d0f;
    border-radius: 54px;
    padding: 12px;
    position: relative;
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 42px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .notch {
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 30px;
    background: #0d0d0f;
    border-radius: 0 0 16px 16px;
    z-index: 20;
  }

  .top-spacer { height: 44px; flex-shrink: 0; }

  .page {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0 24px 0;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid #e8e8e8;
    margin-bottom: 28px;
  }

  .header__title {
    font-size: 15px;
    font-weight: 700;
    color: #1a2b4a;
    line-height: 1.25;
    padding-right: 12px;
  }

  .header__mitid img {
    display: block;
    height: 16px;
    width: auto;
    object-fit: contain;
  }

  /* ---------- Form ---------- */
  .form {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .field-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #1a2b4a;
    margin-bottom: 10px;
  }

  .field-label__help {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #1a2b4a;
  }

  .field-label__help svg {
    display: block;
    width: 18px;
    height: 18px;
  }

  .field-input {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 52px;
    padding: 0 16px;
    border: 2px solid #0066cc;
    border-radius: 4px;
    background: #ffffff;
    margin-bottom: 20px;
  }

  .field-input__value {
    font-size: 15px;
    font-weight: 500;
    color: #1a2b4a;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .field-input__hide {
    font-size: 15px;
    font-weight: 500;
    color: #666;
    flex-shrink: 0;
  }

  .btn-continue {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 52px;
    padding: 0 18px;
    border: none;
    border-radius: 4px;
    background: #0066cc;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 16px;
  }

  .btn-continue svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .help-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: #0066cc;
    margin-bottom: auto;
  }

  .help-link__icon {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #0066cc;
  }

  .help-link__icon svg {
    width: 22px;
    height: 22px;
    display: block;
  }

  /* ---------- Remember me ---------- */
  .remember {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 24px;
    padding-bottom: 20px;
    margin-top: auto;
    border-bottom: 1px solid #e8e8e8;
  }

  .remember__box {
    width: 18px;
    height: 18px;
    border: 2px solid #1a2b4a;
    border-radius: 3px;
    flex-shrink: 0;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .remember__box--checked {
    background: #1a2b4a;
    border-color: #1a2b4a;
    color: #ffffff;
  }

  .remember__box--checked svg {
    display: block;
    width: 12px;
    height: 12px;
  }

  .remember__text {
    font-size: 15px;
    font-weight: 600;
    color: #1a2b4a;
  }

  /* ---------- Footer links ---------- */
  .footer-links {
    display: flex;
    gap: 36px;
    padding-top: 20px;
    padding-bottom: 32px;
  }

  .footer-links span {
    font-size: 15px;
    font-weight: 600;
    color: #1a2b4a;
  }

  html.preview,
  html.preview * {
    cursor: default !important;
    pointer-events: none !important;
  }

  html.preview {
    height: 800px;
    overflow: hidden;
  }

  html.preview body {
    padding: 0;
    margin: 0;
    width: 390px;
    height: 800px;
    min-height: 800px;
    max-height: 800px;
    overflow: hidden;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  html.preview .phone {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: 12px;
    box-sizing: border-box;
  }

  html.preview .screen {
    flex: 1;
    min-height: 0;
    width: 100%;
    height: auto;
  }
</style>
<script>
  if (window.self !== window.top) {
    document.documentElement.classList.add("preview");
  }
</script>
</head>
<body>
 <div class="phone">
  <div class="notch"></div>
  <div class="screen">

    <div class="top-spacer"></div>

    <div class="page">

      <header class="header">
        <h1 class="header__title">Log on at Trulioo</h1>
        <div class="header__mitid">
          <img src="../assets/embeds/denmark/mitid-logo.png" alt="MitID">
        </div>
      </header>

      <div class="form">

        <label class="field-label">
          USER ID
          <span class="field-label__help" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21.75 12C21.75 6.60938 17.3906 2.25 12 2.25C6.60938 2.25 2.25 6.60938 2.25 12C2.25 17.3906 6.60938 21.75 12 21.75C17.3906 21.75 21.75 17.3906 21.75 12ZM0 12C0 5.39062 5.39062 0 12 0C18.6094 0 24 5.39062 24 12C24 18.6094 18.6094 24 12 24C5.39062 24 0 18.6094 0 12ZM12 8.25C11.1562 8.25 10.5 8.90625 10.5 9.75C10.5 10.3594 9.98438 10.875 9.375 10.875C8.76562 10.875 8.25 10.3594 8.25 9.75C8.25 7.6875 9.9375 6 12 6C14.0625 6 15.75 7.6875 15.75 9.75C15.75 11.9531 14.0625 12.8906 13.125 13.2656V13.4062C13.125 14.0625 12.6094 14.5312 12 14.5312C11.3906 14.5312 10.875 14.0625 10.875 13.4062V13.0312C10.875 12.0938 11.5781 11.3906 12.2812 11.1562C12.6094 11.0625 12.8906 10.9219 13.125 10.6875C13.3594 10.5 13.5 10.2188 13.5 9.75C13.5 8.90625 12.8438 8.25 12 8.25ZM10.5 17.25C10.5 16.4062 11.1562 15.75 12 15.75C12.8438 15.75 13.5 16.4062 13.5 17.25C13.5 18.0938 12.8438 18.75 12 18.75C11.1562 18.75 10.5 18.0938 10.5 17.25Z" fill="currentColor"/>
            </svg>
          </span>
        </label>

        <div class="field-input">
          <span class="field-input__value" id="de-username-value">janedoe</span>
          <span class="field-input__hide">Hide</span>
        </div>

        <span class="btn-continue">
          CONTINUE
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </span>

        <span class="help-link">
          <span class="help-link__icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 2.25C6.60938 2.25 2.25 6.60938 2.25 12C2.25 17.3906 6.60938 21.75 12 21.75C17.3906 21.75 21.75 17.3906 21.75 12C21.75 6.60938 17.3906 2.25 12 2.25ZM12 24C5.39062 24 0 18.6094 0 12C0 5.39062 5.39062 0 12 0C18.6094 0 24 5.39062 24 12C24 18.6094 18.6094 24 12 24ZM10.125 15.75H11.25V12.75H10.125C9.51562 12.75 9 12.2344 9 11.625C9 11.0156 9.51562 10.5 10.125 10.5H12.375C12.9844 10.5 13.5 11.0156 13.5 11.625V15.75H13.875C14.4844 15.75 15 16.2656 15 16.875C15 17.4844 14.4844 18 13.875 18H10.125C9.51562 18 9 17.4844 9 16.875C9 16.2656 9.51562 15.75 10.125 15.75ZM12 9C11.1562 9 10.5 8.34375 10.5 7.5C10.5 6.65625 11.1562 6 12 6C12.8438 6 13.5 6.65625 13.5 7.5C13.5 8.34375 12.8438 9 12 9Z" fill="currentColor"/>
            </svg>
          </span>
          Lost user ID?
        </span>

        <div class="remember">
          <span class="remember__box remember__box--checked" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 13l4 4L19 7"/>
            </svg>
          </span>
          <span class="remember__text">Remember me at Trulioo</span>
        </div>

        <div class="footer-links">
          <span>Cancel</span>
          <span>Help</span>
        </div>

      </div>
    </div>

  </div>
 </div>

 <script>
   var username = new URLSearchParams(window.location.search).get("username");
   var usernameEl = document.getElementById("de-username-value");
   if (username && usernameEl) usernameEl.textContent = username;
 </script>
</body>
</html>
