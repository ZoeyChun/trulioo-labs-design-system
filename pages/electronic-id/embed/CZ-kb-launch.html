<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Czechia — KB Launch</title>
<link rel="stylesheet" href="embed-mockup.css?v=noscroll-1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    color-scheme: light only;
  }

  html,
  html * {
    cursor: default !important;
    pointer-events: none !important;
    user-select: none;
  }

  img,
  svg {
    forced-color-adjust: none;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    background: transparent;
    font-family: -apple-system, "Segoe UI", Arial, "Helvetica Neue", Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
  }

  /* ---------- Phone frame ---------- */
  .phone {
    width: 390px;
    height: 800px;
    background: #0d0d0f;
    border-radius: 54px;
    padding: 12px;
    position: relative;
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #000000;
    border-radius: 42px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .notch {
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 30px;
    background: #0d0d0f;
    border-radius: 0 0 16px 16px;
    z-index: 20;
  }

  .app-icon {
    width: auto;
    height: 64px;
    object-fit: contain;
    display: block;
  }

  html.preview,
  html.preview * {
    cursor: default !important;
    pointer-events: none !important;
  }

  html.preview {
    height: 800px;
    overflow: hidden;
  }

  html.preview body {
    padding: 0;
    margin: 0;
    width: 390px;
    height: 800px;
    min-height: 800px;
    max-height: 800px;
    overflow: hidden;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  html.preview .phone {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: 12px;
    box-sizing: border-box;
  }

  html.preview .screen {
    flex: 1;
    min-height: 0;
    width: 100%;
    height: auto;
  }
</style>
<script>
  if (window.self !== window.top) {
    document.documentElement.classList.add("preview");
  }
</script>
</head>
<body>
 <div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <img class="app-icon" src="../assets/embeds/czechia/kb-launch-logo.png" alt="Komerční banka">
  </div>
 </div>

</body>
</html>
