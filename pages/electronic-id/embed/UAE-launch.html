<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>UAE — UAE Pass Launch</title>
<link rel="stylesheet" href="embed-mockup.css?v=noscroll-1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { color-scheme: light only; }

  html.preview,
  html.preview * {
    cursor: default !important;
    pointer-events: none !important;
    user-select: none;
  }

  body {
    background: transparent;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", "Geeza Pro", "Noto Naskh Arabic", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
  }

  .phone {
    width: 390px;
    height: 800px;
    background: #0d0d0f;
    border-radius: 54px;
    padding: 12px;
    position: relative;
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #0e9a62;
    border-radius: 42px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .notch {
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 30px;
    background: #0d0d0f;
    border-radius: 0 0 16px 16px;
    z-index: 20;
  }

  .page {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .room {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .brand {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #ffffff;
    margin-top: -28px;
  }

  .brand img {
    width: 64px;
    height: 64px;
    display: block;
    flex-shrink: 0;
  }

  .brand__ar {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: 0;
  }

  .brand__en {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.15;
    margin-top: 1px;
  }

  html.preview {
    height: 800px;
    overflow: hidden;
  }

  html.preview body {
    padding: 0;
    margin: 0;
    width: 390px;
    height: 800px;
    min-height: 800px;
    max-height: 800px;
    overflow: hidden;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  html.preview .phone {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: 12px;
    box-sizing: border-box;
  }

  html.preview .screen {
    flex: 1;
    min-height: 0;
    width: 100%;
    height: auto;
  }
</style>
<script>
  if (window.self !== window.top) document.documentElement.classList.add("preview");
</script>
</head>
<body>
 <div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="page">
      <img class="room" src="../assets/embeds/uae/uaepass-launch-bg.jpg" alt="">
      <div class="brand">
        <img src="../assets/embeds/uae/uaepass-mark-white.png" alt="">
        <div>
          <div class="brand__ar">الهوية الرقمية</div>
          <div class="brand__en">UAE Pass</div>
        </div>
      </div>
    </div>
  </div>
 </div>
</body>
</html>
