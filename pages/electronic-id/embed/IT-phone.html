<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Italy — SPID Phone Authorization</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html,
  html * {
    cursor: default !important;
    pointer-events: none !important;
    user-select: none;
  }

  body {
    background: transparent;
    font-family: -apple-system, "Segoe UI", Arial, "Helvetica Neue", Helvetica, sans-serif;
    width: 100%;
    height: 100%;
    min-height: 100vh;
  }

  /* Full-viewport overlay layer — stacks on IT-access */
  .overlay {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px 14px 20px;
  }

  .overlay__dim {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 0;
  }

  .overlay__card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 318px;
    background: #ffffff;
    border: 1px solid #d8dce3;
    border-radius: 0;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.14);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Brand row ---------- */
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px 14px;
    border-bottom: 1px solid #e3e6eb;
  }

  .brand-row__spid,
  .brand-row__posteid {
    display: block;
    max-height: 36px;
    width: auto;
    height: auto;
    object-fit: contain;
    flex-shrink: 0;
  }

  .overlay__body {
    padding: 22px 22px 0;
    text-align: center;
  }

  .overlay__title {
    font-size: 20px;
    font-weight: 200;
    color: #666;
    line-height: 1.35;
    margin-bottom: 12px;
  }

  .overlay__intro {
    font-size: 15px;
    font-weight: 400;
    color: #444;
    line-height: 1.45;
    margin-bottom: 22px;
  }

  .overlay__illustration {
    display: block;
    width: 152px;
    height: auto;
    margin: 0 auto 20px;
    object-fit: contain;
  }

  .overlay__help-title {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.35;
    margin-bottom: 6px;
  }

  .overlay__help-text {
    font-size: 14px;
    font-weight: 400;
    color: #555;
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .overlay__actions {
    padding: 20px 20px 18px;
  }

  .btn-cancel {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 44px;
    border-radius: 28px;
    border: 1.5px solid #0066cc;
    background: #ffffff;
    color: #1a1a1a;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* Preview / iframe embed — fill parent iframe, clip to screen radius */
  html.preview {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 42px;
  }

  html.preview body {
    width: 100%;
    height: 100%;
    min-height: 0;
    max-height: none;
    overflow: hidden;
    background: transparent;
    border-radius: 42px;
  }

  html.preview .overlay {
    min-height: 100%;
    height: 100%;
    padding: 28px 12px 16px;
    border-radius: 42px;
    overflow: hidden;
  }

  html.preview .overlay__dim {
    border-radius: 42px;
  }
</style>
<script>
  if (window.self !== window.top) {
    document.documentElement.classList.add("preview");
  }
</script>
</head>
<body>
  <div class="overlay">
    <div class="overlay__dim" aria-hidden="true"></div>

    <div class="overlay__card">
      <div class="brand-row">
        <img class="brand-row__spid" src="../assets/embeds/italy/spid-logo.png" alt="SPID">
        <img class="brand-row__posteid" src="../assets/embeds/italy/posteid-spid-enabled.png" alt="PosteID — New SPID Enabled">
      </div>

      <div class="overlay__body">
        <h1 class="overlay__title">Control your smartphone</h1>
        <p class="overlay__intro">To continue, you need to authorize access in the PosteID App.</p>

        <img class="overlay__illustration" src="../assets/embeds/italy/posteid-phone-authorize.png" alt="">

        <p class="overlay__help-title">Didn't receive the notification?</p>
        <p class="overlay__help-text">You can find it directly within the PosteID App.</p>
      </div>

      <div class="overlay__actions">
        <span class="btn-cancel">CANCEL</span>
      </div>
    </div>
  </div>
</body>
</html>
