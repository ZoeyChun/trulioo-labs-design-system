<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>UAE — UAE PASS Confirm</title>
<link rel="stylesheet" href="embed-mockup.css?v=noscroll-1">
<link rel="stylesheet" href="../../../Components/tap-indicator/tap-indicator.css?v=tap-cue-12">
<script src="../../../Components/tap-indicator/tap-indicator.js?v=tap-cue-5"></script>
<script src="eid-embed-tap.js?v=cursor-1"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { color-scheme: light only; }

  html.preview:not(.eid-embed--interactive),
  html.preview:not(.eid-embed--interactive) * {
    cursor: default !important;
    pointer-events: none !important;
    user-select: none;
  }

  body {
    background: transparent;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "Geeza Pro", "Noto Naskh Arabic", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
  }

  .phone {
    width: 390px;
    height: 800px;
    background: #0d0d0f;
    border-radius: 54px;
    padding: 12px;
    position: relative;
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 42px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .notch {
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 30px;
    background: #0d0d0f;
    border-radius: 0 0 16px 16px;
    z-index: 20;
  }

  .page {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 72px 32px 36px;
    text-align: center;
    color: #2a3038;
  }

  .lockup {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 40px;
  }

  .lockup img {
    width: 46px;
    height: 46px;
    display: block;
  }

  .lockup__ar {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.15;
    color: #1a1a1a;
  }

  .lockup__en {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1.15;
    color: #111;
  }

  .from {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .who {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 32px;
  }

  .art {
    width: 176px;
    height: auto;
    display: block;
    margin-bottom: 28px;
  }

  .instructions {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.45;
    max-width: 280px;
    margin-bottom: 32px;
  }

  .code {
    position: relative;
    width: 92px;
    height: 88px;
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .code__face {
    position: absolute;
    inset: 3px;
    border-radius: 12px;
    background: #e7f4ee;
    box-shadow: 0 8px 16px rgba(40, 80, 60, 0.08);
  }

  .code__ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .code__track,
  .code__progress {
    fill: none;
    stroke-width: 3;
  }

  .code__track { stroke: transparent; }

  .code__progress {
    stroke: #1aaa72;
    stroke-linecap: round;
  }

  .code__value {
    position: relative;
    font-size: 36px;
    font-weight: 600;
    color: #2c3440;
  }

  .waiting {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 8px;
    color: #d5960b;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.25;
    margin-bottom: 0;
    white-space: nowrap;
  }

  .waiting svg { width: 18px; height: 18px; margin-top: 1px; flex-shrink: 0; }

  .hourglass {
    transform-origin: 50% 55%;
    animation: hourglass-flip 2.8s ease-in-out infinite;
  }

  .hourglass__top,
  .hourglass__bottom,
  .hourglass__stream {
    transform-box: fill-box;
  }

  .hourglass__top {
    transform-origin: center top;
    animation: hourglass-top 2.8s linear infinite;
  }

  .hourglass__bottom {
    transform-origin: center bottom;
    animation: hourglass-bottom 2.8s linear infinite;
  }

  .hourglass__stream {
    transform-origin: center top;
    animation: hourglass-stream 2.8s linear infinite;
  }

  @keyframes hourglass-flip {
    0%, 40% { transform: rotate(0deg); }
    50%, 90% { transform: rotate(180deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes hourglass-top {
    0% { transform: scaleY(1); }
    40%, 50% { transform: scaleY(0); }
    90%, 100% { transform: scaleY(1); }
  }

  @keyframes hourglass-bottom {
    0% { transform: scaleY(0); }
    40%, 50% { transform: scaleY(1); }
    90%, 100% { transform: scaleY(0); }
  }

  @keyframes hourglass-stream {
    0%, 34% { opacity: 1; }
    42%, 50% { opacity: 0; }
    58%, 84% { opacity: 1; }
    92%, 100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hourglass,
    .hourglass__top,
    .hourglass__bottom,
    .hourglass__stream {
      animation: none;
    }
  }

  .cancel {
    margin-top: auto;
    padding-top: 28px;
    color: #e13239;
    font-size: 16px;
    font-weight: 600;
  }

  html.preview {
    height: 800px;
    overflow: hidden;
  }

  html.preview body {
    padding: 0;
    margin: 0;
    width: 390px;
    height: 800px;
    min-height: 800px;
    max-height: 800px;
    overflow: hidden;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  html.preview .phone {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: 12px;
    box-sizing: border-box;
  }

  html.preview .screen {
    flex: 1;
    min-height: 0;
    width: 100%;
    height: auto;
  }
</style>
<script>
  EidEmbedTap.initInteractive();
</script>
</head>
<body>
 <div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="page">
      <div class="lockup">
        <img src="../assets/embeds/uae/uaepass-mark.png" alt="">
        <div>
          <div class="lockup__ar">الهوية الرقمية</div>
          <div class="lockup__en">UAE PASS</div>
        </div>
      </div>

      <p class="from">Login request from</p>
      <p class="who">Trulioo</p>

      <img class="art" src="../assets/embeds/uae/login-confirmation-illustration.svg" alt="">

      <p class="instructions">Open your UAE PASS app, select the number shown and confirm to login</p>

      <div class="code" role="button" tabindex="0" data-tds-tap-cue="outline" aria-label="74">
        <div class="code__face"></div>
        <svg class="code__ring" viewBox="0 0 92 88" aria-hidden="true">
          <path class="code__track" d="M46 1.5H76.5A14 14 0 0 1 90.5 15.5V72.5A14 14 0 0 1 76.5 86.5H15.5A14 14 0 0 1 1.5 72.5V15.5A14 14 0 0 1 15.5 1.5H46"></path>
          <path class="code__progress" d="M46 1.5H76.5A14 14 0 0 1 90.5 15.5V72.5A14 14 0 0 1 76.5 86.5H15.5A14 14 0 0 1 1.5 72.5V15.5A14 14 0 0 1 15.5 1.5H46"></path>
        </svg>
        <span class="code__value">74</span>
      </div>
      <div class="waiting">
        <svg class="hourglass" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 3h10M7 21h10" stroke="#d5960b" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M8 3.5c0 4.2 4 6.2 4 8.5s-4 4.3-4 8.5M16 3.5c0 4.2-4 6.2-4 8.5s4 4.3 4 8.5" stroke="#d5960b" stroke-width="1.7" stroke-linejoin="round"/>
          <path class="hourglass__top" d="M9.2 6.2h5.6c-.6 1.6-1.8 2.8-2.8 3.4-1-.6-2.2-1.8-2.8-3.4z" fill="#d5960b"/>
          <path class="hourglass__stream" d="M12 10.2v3.2" stroke="#d5960b" stroke-width="1.3" stroke-linecap="round"/>
          <path class="hourglass__bottom" d="M9.2 17.8h5.6c-.6-1.6-1.8-2.8-2.8-3.4-1 .6-2.2 1.8-2.8 3.4z" fill="#d5960b"/>
        </svg>
        <span>Waiting for your confirmation</span>
      </div>

      <div class="cancel">Cancel Request</div>
    </div>
  </div>
 </div>
<script>
  (function () {
    var progress = document.querySelector(".code__progress");
    if (!progress) return;

    var length = progress.getTotalLength();
    var segment = length / 3;
    progress.style.strokeDasharray = segment + " " + (length - segment);
    progress.style.strokeDashoffset = "0";

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var started = performance.now();
    var duration = 2800;
    function frame(now) {
      var elapsed = (now - started) % duration;
      if (elapsed < 0) elapsed += duration;
      progress.style.strokeDashoffset = String(-length * (elapsed / duration));
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  (function () {
    if (!EidEmbedTap.initInteractive()) return;
    EidEmbedTap.bindTap(document.querySelector(".code"), "eid-launch-confirm");
  })();
</script>
</body>
</html>
