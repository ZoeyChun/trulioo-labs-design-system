<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>UAE — UAE PASS PIN</title>
<link rel="stylesheet" href="embed-mockup.css?v=noscroll-1">
<link rel="stylesheet" href="../../../Components/tap-indicator/tap-indicator.css?v=tap-cue-12">
<script src="../../../Components/tap-indicator/tap-indicator.js?v=tap-cue-5"></script>
<script src="eid-embed-tap.js?v=cursor-1"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { color-scheme: light only; }

  html.preview:not(.eid-embed--interactive),
  html.preview:not(.eid-embed--interactive) * {
    cursor: default !important;
    pointer-events: none !important;
    user-select: none;
  }

  body {
    background: transparent;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "Geeza Pro", "Noto Naskh Arabic", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
  }

  .phone {
    width: 390px;
    height: 800px;
    background: #0d0d0f;
    border-radius: 54px;
    padding: 12px;
    position: relative;
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #c94444;
    border-radius: 42px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .notch {
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 30px;
    background: #0d0d0f;
    border-radius: 0 0 16px 16px;
    z-index: 20;
  }

  .status {
    position: relative;
    z-index: 6;
    height: 46px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 22px 6px 26px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .status__icons {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status__icons svg { display: block; }

  .behind-title {
    text-align: center;
    color: rgba(255,255,255,0.55);
    font-size: 22px;
    font-weight: 700;
    margin-top: 8px;
  }

  .sheet {
    position: absolute;
    top: 78px;
    left: 0;
    right: 0;
    bottom: 0;
    background: #ffffff;
    z-index: 3;
    display: flex;
    flex-direction: column;
  }

  .exit {
    position: absolute;
    top: 16px;
    right: 22px;
    color: #1aaa72;
    font-size: 16px;
    font-weight: 600;
    z-index: 4;
  }

  .pin-body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px 12px;
    text-align: center;
  }

  .lockup {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .lockup img { width: 42px; height: 42px; display: block; }

  .lockup__ar {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.15;
    color: #1a1a1a;
    text-align: left;
  }

  .lockup__en {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1.15;
    color: #111;
    text-align: left;
  }

  .pin-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #111;
    margin-bottom: 10px;
  }

  .pin-sub {
    font-size: 14px;
    color: #3a3a3a;
    margin-bottom: 24px;
  }

  .dots {
    display: flex;
    gap: 18px;
    margin-bottom: 26px;
  }

  .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid #1aaa72;
  }

  .dot--filled {
    background: #1aaa72;
  }

  .rule {
    width: 72%;
    height: 1px;
    background: #e6e6e6;
    margin-bottom: 0;
  }

  .face {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: #8e8e93;
    font-size: 14px;
  }

  .face svg { width: 36px; height: 36px; }

  .keypad {
    position: relative;
    flex-shrink: 0;
    background: #d5d8de;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 6px;
    margin-top: auto;
    padding: 14px 8px 30px;
  }

  .key {
    height: 48px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.28);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #111;
    line-height: 1;
  }

  .key b {
    font-size: 24px;
    font-weight: 500;
  }

  .key small {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #111;
    margin-top: 1px;
  }

  .key--zero { grid-column: 2; grid-row: 4; }
  .key--del {
    grid-column: 3;
    grid-row: 4;
    background: transparent;
    box-shadow: none;
  }

  .home {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    border-radius: 3px;
    background: #111;
    z-index: 6;
  }

  html.preview {
    height: 800px;
    overflow: hidden;
  }

  html.preview body {
    padding: 0;
    margin: 0;
    width: 390px;
    height: 800px;
    min-height: 800px;
    max-height: 800px;
    overflow: hidden;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  html.preview .phone {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: 12px;
    box-sizing: border-box;
  }

  html.preview .screen {
    flex: 1;
    min-height: 0;
    width: 100%;
    height: auto;
  }
</style>
<script>
  EidEmbedTap.initInteractive();
</script>
</head>
<body>
 <div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="status">
      <span>9:41</span>
      <span class="status__icons">
        <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 2.2 1.2 9.4c-.4.4-.1 1.1.5 1.1h12.6c.6 0 .9-.7.5-1.1L8 2.2z" fill="#fff"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="4.5" y="5" width="3" height="7" rx="0.6"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.6"/><rect x="13.5" y="0" width="2.5" height="12" rx="0.6"/></svg>
        <svg width="15" height="12" viewBox="0 0 15 12" fill="none" aria-hidden="true"><path d="M7.4 2.6c1.7 0 3.2.7 4.3 1.8" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M4.6 6.2c.7-.7 1.7-1.1 2.8-1.1s2.1.4 2.8 1.1" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><circle cx="7.4" cy="9.2" r="1.15" fill="#fff"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true"><rect x="0.6" y="0.6" width="20" height="10.8" rx="2.2" stroke="#fff" stroke-width="1.2"/><rect x="2" y="2" width="15" height="8" rx="1.2" fill="#fff"/><path d="M22 4.2h1.2c.7 0 1.2.5 1.2 1.2v1.2c0 .7-.5 1.2-1.2 1.2H22V4.2z" fill="#fff"/></svg>
      </span>
    </div>
    <div class="behind-title">Login Request Alert</div>

    <div class="sheet">
      <div class="exit">Exit</div>
      <div class="pin-body">
        <div class="lockup">
          <img src="../assets/embeds/uae/uaepass-mark.png" alt="">
          <div>
            <div class="lockup__ar">الهوية الرقمية</div>
            <div class="lockup__en">UAE PASS</div>
          </div>
        </div>
        <h1 class="pin-title">Enter PIN</h1>
        <p class="pin-sub">Please enter your UAE PASS PIN</p>
        <div class="dots" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div class="rule"></div>
        <div class="face">
          <svg viewBox="0 0 36 36" fill="none" aria-hidden="true">
            <path d="M8 4h6M22 4h6M4 8v6M4 22v6M8 32h6M22 32h6M32 8v6M32 22v6" stroke="#1aaa72" stroke-width="2" stroke-linecap="round"/>
            <circle cx="14" cy="16" r="1.3" fill="#1aaa72"/>
            <circle cx="22" cy="16" r="1.3" fill="#1aaa72"/>
            <path d="M14.5 22c1.2 1.4 5.8 1.4 7 0" stroke="#1aaa72" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          Try with Face ID
        </div>
      </div>

      <div class="keypad">
        <div class="key" role="button" tabindex="0" data-tds-tap-cue="outline"><b>1</b></div>
        <div class="key"><b>2</b><small>ABC</small></div>
        <div class="key"><b>3</b><small>DEF</small></div>
        <div class="key"><b>4</b><small>GHI</small></div>
        <div class="key"><b>5</b><small>JKL</small></div>
        <div class="key"><b>6</b><small>MNO</small></div>
        <div class="key"><b>7</b><small>PQRS</small></div>
        <div class="key"><b>8</b><small>TUV</small></div>
        <div class="key"><b>9</b><small>WXYZ</small></div>
        <div class="key key--zero"><b>0</b></div>
        <div class="key key--del" aria-hidden="true">
          <svg width="26" height="20" viewBox="0 0 26 20" fill="none">
            <path d="M8 1.5h14.5A2.5 2.5 0 0 1 25 4v12a2.5 2.5 0 0 1-2.5 2.5H8L1.8 10 8 1.5z" stroke="#111" stroke-width="1.4"/>
            <path d="M12 6.5l7 7M19 6.5l-7 7" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="home" aria-hidden="true"></div>
  </div>
 </div>
<script>
  (function () {
    if (!EidEmbedTap.initInteractive()) return;
    var key = document.querySelector("[data-tds-tap-cue]");
    if (!key) return;
    key.style.cursor = "pointer";
    if (window.TdsTapCue) window.TdsTapCue.show(key);
    var sent = false;
    function go() {
      if (sent) return;
      sent = true;
      if (window.TdsTapCue) window.TdsTapCue.hide();
      var dots = document.querySelectorAll(".dot");
      dots.forEach(function (dot, index) {
        window.setTimeout(function () {
          dot.classList.add("dot--filled");
        }, index * 140);
      });
      window.setTimeout(function () {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ source: "eid-embed", type: "eid-consent-accept" }, "*");
        }
      }, dots.length * 140 + 420);
    }
    key.addEventListener("click", go);
    key.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      go();
    });
  })();
</script>
</body>
</html>
