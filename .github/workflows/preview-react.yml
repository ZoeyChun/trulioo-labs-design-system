name: React Preview

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pages/preview/react/package-lock.json

      - name: Install dependencies
        working-directory: pages/preview/react
        run: npm ci

      - name: Build tracker + React preview
        working-directory: pages/preview/react
        run: npm run build

      - name: Verify react-dist is committed
        run: git diff --exit-code pages/preview/react-dist/
