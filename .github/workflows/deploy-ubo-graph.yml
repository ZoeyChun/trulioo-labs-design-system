name: Deploy UBO Graph to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/Experiments/ubo-graph/**'
      - '.github/workflows/deploy-ubo-graph.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-ubo-graph
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pages/Experiments/ubo-graph

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pages/Experiments/ubo-graph/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Commit built site
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Deploy UBO Graph site to GitHub Pages'
          file_pattern: pages/Experiments/ubo-graph/site/**
          branch: main
          skip_fetch: false
          skip_checkout: false
