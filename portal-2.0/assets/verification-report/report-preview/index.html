      </div>
      <div class="d3-chat-pane__body">
        <div class="d3-chat-pane__empty">
          <div>
            <p class="d3-chat-pane__hello">What would you like to accomplish?</p>
          </div>
          <div class="d3-chat-pane__prompts">
            <button type="button" class="d3-prompt-card" data-d5-prompt="Verify Meridian Apex Consulting Ltd.">
              <span class="d3-prompt-card__text">
                <span class="d3-prompt-card__title">Verify a business</span>

            <button type="button" class="d3-prompt-card" data-d5-prompt="What does a KYB report include?">

              </span>

            </button>
          </div>
        </div>
        <div class="d3-chat-pane__thread" data-d5-chat-thread hidden></div>
        <div class="d3-chat-pane__composer">
          <form class="d1-prompt d3-pane-idle-form" data-d5-chat-form action="#" method="post">
            <div class="d1-prompt__field">
              <textarea id="d5-pane-prompt" class="d1-prompt__input" data-d5-chat-input rows="1" placeholder="Describe your task or ask about an agent" aria-label="Describe your task or ask about an agent"></textarea>

            <div class="d1-prompt__bar">
              <div class="d1-prompt__actions">

            </div>

        </div>
      </div>

    <button type="button" class="d3-askbar" data-d5-askbar aria-controls="d5-chat-pane" aria-expanded="true">
