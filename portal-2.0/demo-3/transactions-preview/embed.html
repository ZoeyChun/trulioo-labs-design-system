<body>

<div class="d3-tx-embed" id="app-shell">


  <!-- ============================================================
       STAGE — owned by shared/portal-shell/shell.css. Do not restyle.
       ============================================================ -->
  <div class="d3-tx-embed__stage">

    <!-- ▼▼▼ LEFT — page content ▼▼▼  owner: css/page.css, prefix v2-
         Add page widgets inside <main>. Nothing here may reference
         .ai-* or the [data-truai] state. -->
    <main class="d3-tx-embed__main">
      <section class="th-tx ut-tx-main">
        <h1 class="th-tx__title">Transactions</h1>
        <div class="ut-tx-main__scroll">
        <div class="ut-tx-page">
        <div class="ut-tx-block">
          <div class="ut-tx-toolbar">
            <div class="ut-tx-toolbar__left">
              <div class="tds-text-input ut-tx-search">
                <div class="tds-text-input__field tds-text-input__field--lg">
                  <input class="tds-text-input__native" id="utTxSearch" type="search" placeholder="Search by name, country or ID" autocomplete="off" aria-label="Search by name, country or ID">
                  <button type="button" class="ut-tx-search__clear" id="utTxSearchClear" hidden aria-label="Clear search">
                    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                  </button>
                  <button type="button" class="tds-icon-btn tds-icon-btn--primary tds-icon-btn--sm ut-tx-search__submit" aria-label="Search">
                    <span class="tds-icon-btn__icon" aria-hidden="true">
                      <svg class="icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.25"/><path d="M10.5 10.5 13.5 13.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
                    </span>
                  </button>
                </div>
              </div>

              <div class="tds-date-picker-range tds-date-picker-range--interactive ut-tx-date" data-date-picker-range data-size="lg" data-view="03/16/2026" id="utTxDateWrap">
                <div class="tds-date-picker-range__fields">
                  <div class="tds-date-picker" data-date-picker-part="start">
                    <button type="button" class="tds-date-picker__field tds-date-picker__field--lg" aria-haspopup="dialog" aria-expanded="false" aria-label="Filter by date">
                      <span class="tds-date-picker__icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.25"/><path d="M2 6.5h12M5.5 1.75V4M10.5 1.75V4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg></span>
                      <span class="tds-date-picker__value tds-date-picker__placeholder visually-hidden">mm/dd/yyyy</span>
                      <span class="ut-tx-date__label tds-date-picker__placeholder">mm/dd/yyyy</span>
                      <span class="ut-tx-date__clear" hidden role="button" tabindex="0" aria-label="Clear date">
                        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                      </span>
                    </button>
                  </div>
                  <div class="tds-date-picker ut-tx-date__end" data-date-picker-part="end">
                    <button type="button" class="tds-date-picker__field tds-date-picker__field--lg" aria-haspopup="dialog" aria-expanded="false" tabindex="-1" aria-label="End date">
                      <span class="tds-date-picker__value tds-date-picker__placeholder">mm/dd/yyyy</span>
                    </button>
                  </div>
                </div>
              </div>

              <div class="tds-text-input ut-tx-product" id="utTxProductWrap" hidden>
                <div class="tds-text-input__field tds-text-input__field--lg">
                  <select class="tds-text-input__native ut-tx-product__select" id="utTxProduct" aria-label="Filter by product">
                    <option value="" selected>Product</option>
                  </select>
                  <span class="tds-caret tds-caret--default" aria-hidden="true">
                    <svg viewBox="0 0 8 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.073724 3.46966L3.4702 0.0732225C3.56783 -0.0244075 3.72612 -0.0244075 3.82375 0.0732225L7.22014 3.46966C7.37764 3.62716 7.26614 3.89644 7.04334 3.89644H0.250504C0.0277738 3.89644 -0.083766 3.62715 0.073724 3.46966Z" fill="currentColor"/><path d="M0.073724 7.32322L3.4702 10.7197C3.56783 10.8173 3.72612 10.8173 3.82375 10.7197L7.22014 7.32322C7.37764 7.16572 7.26614 6.89644 7.04334 6.89644H0.250504C0.0277738 6.89644 -0.083766 7.16573 0.073724 7.32322Z" fill="currentColor"/></svg>
                  </span>
                </div>
              </div>

            </div>
          </div>

          <div class="ut-tx-quick" id="utTxQuick">
            <div class="ut-tx-quick__item" data-quick="outcome">
              <button type="button" class="tds-btn tds-btn--sm tds-btn--secondary ut-tx-quick__btn" aria-haspopup="true" aria-expanded="false">
                <span class="ut-tx-quick__label">Outcome</span>
                <span class="tds-counter tds-counter--primary tds-counter--sm ut-tx-quick__count" hidden>0</span>
                <svg class="icon ut-tx-quick__caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
              </button>
              <div class="ut-tx-quick__menu" role="group" aria-label="Outcome" hidden>
                <div class="ut-tx-filters__options">
            <label class="ut-tx-filters__option">
              <input class="tds-checkbox" type="checkbox" name="ut-filt-outcome" value="positive">
              <span class="ut-tx-filters__option-text">
                <span class="ut-tx-filters__option-label ut-tx-filters__option-label--positive">Verified</span>
              </span>
            </label>
            <label class="ut-tx-filters__option">
              <input class="tds-checkbox" type="checkbox" name="ut-filt-outcome" value="negative">
              <span class="ut-tx-filters__option-text">
                <span class="ut-tx-filters__option-label ut-tx-filters__option-label--negative">Not Verified</span>
              </span>
            </label>
            <label class="ut-tx-filters__option">
              <input class="tds-checkbox" type="checkbox" name="ut-filt-outcome" value="intermediate">
              <span class="ut-tx-filters__option-text">
                <span class="ut-tx-filters__option-label ut-tx-filters__option-label--intermediate">In Progress</span>
              </span>
            </label>
            <label class="ut-tx-filters__option">
              <input class="tds-checkbox" type="checkbox" name="ut-filt-outcome" value="not-completed">
              <span class="ut-tx-filters__option-text">
                <span class="ut-tx-filters__option-label">Not Complete</span>
                <span class="ut-tx-filters__option-desc">Timed Out, Failed</span>
              </span>
            </label>
          </div>
              </div>
            </div>
            <div class="ut-tx-quick__item" data-quick="risk">
              <button type="button" class="tds-btn tds-btn--sm tds-btn--secondary ut-tx-quick__btn" aria-haspopup="true" aria-expanded="false">
                <span class="ut-tx-quick__label">Risk</span>
                <span class="tds-counter tds-counter--primary tds-counter--sm ut-tx-quick__count" hidden>0</span>
                <svg class="icon ut-tx-quick__caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
              </button>
              <div class="ut-tx-quick__menu" role="group" aria-label="Risk" hidden>
                <div class="ut-tx-filters__options">
            <label class="ut-tx-filters__option"><input class="tds-checkbox" type="checkbox" name="ut-filt-risk" value="high"><span class="ut-tx-filters__option-text"><span class="ut-tx-filters__option-label ut-tx-filters__option-label--regular">High Risk</span></span></label>
            <label class="ut-tx-filters__option"><input class="tds-checkbox" type="checkbox" name="ut-filt-risk" value="medium"><span class="ut-tx-filters__option-text"><span class="ut-tx-filters__option-label ut-tx-filters__option-label--regular">Medium Risk</span></span></label>
            <label class="ut-tx-filters__option"><input class="tds-checkbox" type="checkbox" name="ut-filt-risk" value="low"><span class="ut-tx-filters__option-text"><span class="ut-tx-filters__option-label ut-tx-filters__option-label--regular">Low Risk</span></span></label>
          </div>
              </div>
            </div>
            <div class="ut-tx-quick__item" data-quick="country">
              <button type="button" class="tds-btn tds-btn--sm tds-btn--secondary ut-tx-quick__btn" aria-haspopup="true" aria-expanded="false">
                <span class="ut-tx-quick__label">Country</span>
                <span class="tds-counter tds-counter--primary tds-counter--sm ut-tx-quick__count" hidden>0</span>
                <svg class="icon ut-tx-quick__caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
              </button>
              <div class="ut-tx-quick__menu" role="group" aria-label="Country" hidden>
                <div class="ut-tx-filters__options" id="utFiltCountryOptions"></div>
              </div>
            </div>
            <div class="tds-filter-button" id="utTxFilter">
              <button type="button" class="tds-btn tds-btn--sm tds-btn--secondary" id="utTxFilterBtn" aria-haspopup="dialog" aria-controls="utTxFilters" aria-expanded="false">
                <span class="tds-btn__leading-icon" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
                </span>
                <span class="tds-filter-button__trigger-default">More filters</span>
                <span class="tds-counter tds-counter--primary tds-counter--sm tds-filter-button__counter" id="utTxFilterCount" hidden>0</span>
              </button>
            </div>
            <button type="button" class="tds-btn tds-btn--sm tds-btn--invisible ut-tx-quick__clear" id="utTxQuickClear" hidden>Clear all filters</button>
          </div>

          <div class="ut-tx-stats" id="utTxStats" aria-label="Transaction summary"></div>

          <div class="ut-tx-table-section">
            <p class="ut-tx-search-status" id="utTxSearchStatus" hidden></p>
            <div class="tds-data-table-container ut-tx-table-card">
              <div class="ut-tx-table-scroll">
                <div class="tds-data-table__wrapper">
                  <table class="tds-data-table ut-tx-table">
                    <colgroup id="utTxCols"></colgroup>
                    <thead id="utTxHead"></thead>
                    <tbody id="utTxBody"></tbody>
                  </table>
                </div>
              </div>

              <div class="tds-data-table__footer" id="utTxFooter"></div>
            </div>
          </div>
        </div>
        </div>
        </div>
      </section>

  </div>

    <aside class="ut-tx-filters" id="utTxFilters" role="dialog" aria-modal="false" aria-labelledby="utTxFiltersTitle" aria-hidden="true" hidden>
      <header class="ut-tx-filters__header">
        <h2 class="ut-tx-filters__title" id="utTxFiltersTitle">More filters</h2>
        <div class="ut-tx-filters__header-actions">
          <button type="button" class="tds-btn tds-btn--sm tds-btn--invisible ut-tx-filters__clear" id="utTxFiltersClear" disabled>Clear all filters</button>
          <button type="button" class="tds-icon-btn tds-icon-btn--secondary tds-icon-btn--sm ut-tx-filters__close" aria-label="Close filters">
            <span class="tds-icon-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4 4 12"/></svg>
            </span>
          </button>
        </div>
      </header>

      <div class="ut-tx-filters__body">
        <div class="ut-tx-filters__body-inner">
        <!-- Outcome, Risk and Country are also quick filters in the toolbar.
             They are mirrored here so this drawer is a complete view of what
             is filtering the table; demo-transactions.js clones the option
             lists out of the quick menus so there is one source of truth, and
             transaction-history.js keeps both copies ticked in step. -->
        <section class="ut-tx-filters__section" aria-labelledby="utFiltOutcome" hidden>
          <h3 class="ut-tx-filters__heading" id="utFiltOutcome">Outcome</h3>
          <div class="ut-tx-filters__options" data-ut-mirror="outcome"></div>
        </section>

        <section class="ut-tx-filters__section" aria-labelledby="utFiltRisk" hidden>
          <h3 class="ut-tx-filters__heading" id="utFiltRisk">Risk</h3>
          <div class="ut-tx-filters__options" data-ut-mirror="risk"></div>
        </section>

        <section class="ut-tx-filters__section" aria-labelledby="utFiltCountry" hidden>
          <h3 class="ut-tx-filters__heading" id="utFiltCountry">Country</h3>
          <div class="ut-tx-filters__options" data-ut-mirror="country" data-ut-country-options></div>
        </section>

        <section class="ut-tx-filters__section" aria-labelledby="utFiltType">
          <h3 class="ut-tx-filters__heading" id="utFiltType">Type</h3>
          <div class="tds-segmented-control tds-segmented-control--sm ut-tx-filters__switch" id="utFiltTypeSwitch" role="group" aria-label="Transaction type">
            <button type="button" class="tds-segmented-control__item tds-segmented-control__item--selected" data-ut-type="Live" aria-pressed="true">
              <span class="tds-segmented-control__label">Live</span>
            </button>
            <button type="button" class="tds-segmented-control__item" data-ut-type="Demo" aria-pressed="false">
              <span class="tds-segmented-control__label">Demo</span>
            </button>
          </div>
        </section>

        <section class="ut-tx-filters__section" aria-labelledby="utFiltProduct">
          <h3 class="ut-tx-filters__heading" id="utFiltProduct">Product</h3>
          <div class="ut-tx-filters__options" id="utFiltProductOptions"></div>
        </section>

        <section class="ut-tx-filters__section" aria-labelledby="utFiltSource">
          <h3 class="ut-tx-filters__heading" id="utFiltSource">Source</h3>
          <!-- Same control as Package: a DS dropdown of action-list-items,
               each naming the key, user or workflow and, beneath it, the
               channel it ran through. -->
          <div class="tds-button-menu ut-tx-pkg-select" id="utFiltSourceSelect" data-ut-value="">
            <button type="button" class="ut-tx-pkg-select__trigger" aria-haspopup="menu" aria-expanded="false" aria-labelledby="utFiltSource utFiltSourceValue">
              <span class="tds-text-input__leading-icon" aria-hidden="true">
                <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.25"/><path d="M10.5 10.5 13.5 13.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
              </span>
              <span class="ut-tx-pkg-select__value ut-tx-pkg-select__value--placeholder" id="utFiltSourceValue">Select Source</span>
              <span class="tds-caret tds-caret--default" aria-hidden="true">
                <svg viewBox="0 0 8 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.073724 3.46966L3.4702 0.0732225C3.56783 -0.0244075 3.72612 -0.0244075 3.82375 0.0732225L7.22014 3.46966C7.37764 3.62716 7.26614 3.89644 7.04334 3.89644H0.250504C0.0277738 3.89644 -0.083766 3.62715 0.073724 3.46966Z" fill="currentColor"/><path d="M0.073724 7.32322L3.4702 10.7197C3.56783 10.8173 3.72612 10.8173 3.82375 10.7197L7.22014 7.32322C7.37764 7.16572 7.26614 6.89644 7.04334 6.89644H0.250504C0.0277738 6.89644 -0.083766 7.16573 0.073724 7.32322Z" fill="currentColor"/></svg>
              </span>
            </button>
            <div class="tds-dropdown-panel ut-tx-pkg-select__panel" id="utFiltSourceOptions" role="menu" hidden></div>
          </div>
        </section>

        <section class="ut-tx-filters__section" aria-labelledby="utFiltPackage">
          <h3 class="ut-tx-filters__heading" id="utFiltPackage">Package</h3>
          <!-- Select with subtitles: a DS dropdown panel of action-list-items,
               each naming the package and, beneath it, the product it belongs to. -->
          <div class="tds-button-menu ut-tx-pkg-select" id="utFiltPackageSelect" data-ut-value="">
            <button type="button" class="ut-tx-pkg-select__trigger" aria-haspopup="menu" aria-expanded="false" aria-labelledby="utFiltPackage utFiltPackageValue">
              <span class="tds-text-input__leading-icon" aria-hidden="true">
                <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.25"/><path d="M10.5 10.5 13.5 13.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
              </span>
              <span class="ut-tx-pkg-select__value ut-tx-pkg-select__value--placeholder" id="utFiltPackageValue">Select Package</span>
              <span class="tds-caret tds-caret--default" aria-hidden="true">
                <svg viewBox="0 0 8 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.073724 3.46966L3.4702 0.0732225C3.56783 -0.0244075 3.72612 -0.0244075 3.82375 0.0732225L7.22014 3.46966C7.37764 3.62716 7.26614 3.89644 7.04334 3.89644H0.250504C0.0277738 3.89644 -0.083766 3.62715 0.073724 3.46966Z" fill="currentColor"/><path d="M0.073724 7.32322L3.4702 10.7197C3.56783 10.8173 3.72612 10.8173 3.82375 10.7197L7.22014 7.32322C7.37764 7.16572 7.26614 6.89644 7.04334 6.89644H0.250504C0.0277738 6.89644 -0.083766 7.16573 0.073724 7.32322Z" fill="currentColor"/></svg>
              </span>
            </button>
            <div class="tds-dropdown-panel ut-tx-pkg-select__panel" id="utFiltPackageOptions" role="menu" hidden></div>
          </div>
        </section>

        </div>
      </div>
    </aside>
</div>

<div class="ut-tx-toast tds-announcement tds-announcement--neutral tds-announcement--inline" id="utTxToast" role="status" aria-live="polite" hidden>
    <span class="tds-announcement__icon" aria-hidden="true">

<script>
  window.UT_TX_RESULT_HREF = "../../../pages/user-testing/transaction-history/result.html";
  window.UT_TX_SETTINGS_KEY = "demo3-tx";
  window.UT_TX_PLAIN_TABLE = true;
  /* Sort is offered on Date only. */
  window.UT_TX_SORT_DATE_ONLY = true;
  /* Source names who or what ran the check, so Type adds nothing. */
  window.UT_TX_NO_TYPE_COLUMN = true;
  /* Package — the named bundle of checks the transaction ran under. */
  window.UT_TX_PACKAGE_COLUMN = true;
  /* Outcomes: Verified / Not Verified / In Progress / Not Complete. */
  window.UT_TX_OUTCOMES_V2 = true;
  /* Risk score sits under the outcome rather than in its own column. */
  window.UT_TX_SCORE_IN_OUTCOME = true;
  /* KPI cards describe the current view, not the whole dataset. */
  window.UT_TX_STATS_FOLLOW_FILTERS = true;
</script>
