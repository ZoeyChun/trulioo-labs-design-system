<template data-d1-tpl="tools">
              <section class="d1-block d1-enter">
                <div class="d1-progress">
                  <div class="d1-progress__row">
                    <span data-d1-tools-label>Investigating</span>
                    <span class="d1-progress__pct">0%</span>
                    <i data-d1-tools-check class="fa-regular fa-circle-check" aria-hidden="true"></i>
                  </div>
                  <div class="d1-progress__track"><div class="d1-progress__fill d1-progress__fill--active"></div></div>
                </div>
                <div class="d1-steps" data-d1-steps></div>
              </section>
            </template>

<template data-d1-tpl="activity">
              <div class="d1-activity d1-enter">
                <button type="button" class="d1-activity__toggle d1-activity__toggle--current" data-d1-activity aria-expanded="true">
                  <span class="d1-activity__mark">
                    <i data-d1-mark="run" class="d1-spin fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
                    <i data-d1-mark="done" class="fa-regular fa-circle-check" aria-hidden="true" hidden></i>
                  </span>
                  <span data-d1-activity-label></span>
                  <svg class="d3-fa-line d1-chev-down" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="m4 6 4 4 4-4"/></svg>
                  <svg class="d3-fa-line d1-chev-up" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="m4 10 4-4 4 4"/></svg>
                </button>
                <div class="d1-activity__body">
                  <div class="d1-activity__rail"><img src="../assets/icons/divider.svg" alt="" width="1" height="68"></div>
                  <div class="d1-activity__detail" data-d1-activity-detail></div>
                </div>
              </div>
            </template>

<template data-d1-tpl="report">
              <section class="d1-block d1-enter">
                <div>
                  <h2 class="d1-report__title"><span data-d1-co>Meridian Apex Consulting Ltd.</span></h2>
                  <span class="d1-tag d1-tag--positive" data-d1-report-tag>Verified</span>
                  <div class="d1-report__body">
                    <div class="d1-summary" data-d1-summary>
                      <h3>Summary</h3>
                      <p data-d1-sum-a></p>
                      <p data-d1-sum-b hidden></p>
                    </div>
                    <div class="d1-report-ready" data-d1-report-action>
                      <p class="d1-report-ready__title">Business Verification Report is ready</p>
                      <div class="d1-report-ready__card">
                        <span class="d1-report-ready__icon" aria-hidden="true">
                          <i class="fa-regular fa-file-lines"></i>
                        </span>
                        <div class="d1-report-ready__meta">
                          <p class="d1-report-ready__name" data-d1-report-ready-name>Meridian Apex Consulting Ltd.</p>
                          <p class="d1-report-ready__addr" data-d1-report-ready-addr>Suite 400, 1 King Street, London EC2V 8AU</p>
                          <p class="d1-report-ready__reg" data-d1-report-ready-reg>Reg. 08842190</p>
                        </div>
                        <button type="button" class="tds-btn tds-btn--primary tds-btn--md">View</button>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="d1-actions">
                  <button type="button" class="tds-icon-btn tds-icon-btn--sm tds-icon-btn--invisible tds-icon-btn--circular" aria-label="Share"><span class="tds-icon-btn__icon"><i class="fa-regular fa-share-from-square" aria-hidden="true"></i></span></button>
                  <button type="button" class="tds-icon-btn tds-icon-btn--sm tds-icon-btn--invisible tds-icon-btn--circular" data-d1-copy aria-label="Copy"><span class="tds-icon-btn__icon"><i class="fa-regular fa-copy" aria-hidden="true"></i></span></button>
                  <button type="button" class="tds-icon-btn tds-icon-btn--sm tds-icon-btn--invisible tds-icon-btn--circular" data-d1-regen aria-label="Regenerate"><span class="tds-icon-btn__icon"><svg class="d3-fa-line" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M13 8a5 5 0 1 1-1.2-3.25M13 3.5V6.5H10"/></svg></span></button>
                  <button type="button" class="tds-icon-btn tds-icon-btn--sm tds-icon-btn--invisible tds-icon-btn--circular" data-d1-vote aria-pressed="false" aria-label="Good response"><span class="tds-icon-btn__icon"><i class="fa-regular fa-thumbs-up" aria-hidden="true"></i></span></button>
                  <button type="button" class="tds-icon-btn tds-icon-btn--sm tds-icon-btn--invisible tds-icon-btn--circular" data-d1-vote aria-pressed="false" aria-label="Poor response"><span class="tds-icon-btn__icon"><i class="fa-regular fa-thumbs-down" aria-hidden="true"></i></span></button>
                </div>
              </section>
            </template>

<template data-d1-tpl="confirm">
              <section class="d1-block d1-enter">
                <div class="tds-announcement tds-announcement--info d1-confirm" data-d1-confirm-card>
                  <span class="tds-announcement__icon" data-d1-confirm-icon aria-hidden="true"><svg class="d3-fa-line" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="m3 13 6.5-6.5M10.5 3l.7 1.8L13 5.5l-1.8.7L10.5 8l-.7-1.8L8 5.5l1.8-.7L10.5 3ZM4 4.5l.4 1 .9.4-.9.4L4 7.5l-.4-1-.9-.4.9-.4L4 4.5Z"/></svg></span>
                  <div class="tds-announcement__content">
                    <p class="tds-announcement__title" data-d1-confirm-action></p>
                    <p class="tds-announcement__message" data-d1-confirm-detail></p>
                    <div class="tds-announcement__actions" data-d1-confirm-buttons>
                      <button type="button" class="tds-btn tds-btn--sm tds-btn--primary" data-d1-confirm-yes>Confirm</button>
                      <button type="button" class="tds-btn tds-btn--sm tds-btn--secondary" data-d1-confirm-no>Cancel</button>
                    </div>
                  </div>
                </div>
              </section>
            </template>

<template data-d1-tpl="analysis">
              <section class="d1-block d1-enter">
                <div class="d1-card" data-d1-analysis-card>
                  <h3 class="d1-card__title" data-d1-analysis-title></h3>
                  <div class="d1-card__body" data-d1-analysis-rows></div>
                </div>
              </section>
            </template>

<template data-d1-tpl="compare">
              <section class="d1-block d1-enter">
                <div class="tds-data-table-container d1-compare-table">
                  <table class="tds-data-table tds-data-table--compact">
                    <thead>
                      <tr>
                        <th></th>
                        <th data-d1-compare-left></th>
                        <th data-d1-compare-right></th>
                      </tr>
                    </thead>
                    <tbody data-d1-compare-rows></tbody>
                  </table>
                </div>
              </section>
            </template>

<template data-d1-tpl="guide">
              <section class="d1-block d1-enter">
                <div class="d1-card" data-d1-guide-card>
                  <h3 class="d1-card__title" data-d1-guide-title></h3>
                  <div class="d1-card__body" data-d1-guide-steps></div>
                </div>
              </section>
            </template>
