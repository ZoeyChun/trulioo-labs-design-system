<!-- Portal 2.0 home, Layout 01 / Design 6 — built from Figma
     "Portal-2.0-Design---2026", node 1476:49405.
     https://www.figma.com/design/qtvqgc1fWEw0znhl4b8xPF/?node-id=1476-49405

     A different home from demo-2/home (node 1015:91926): the stat strip,
     action cards, transaction table and the docked TruAI panel are all
     gone. What's left is a centred hero — greeting, prompt input, three
     suggestion chips — floating on a dot field, with a Quick start row of
     three report cards below it. The side rail drops to a single nav item.

     The dot field in the node is two overlapping raster tiles
     (1496:54059 / 1496:54061). It is generated at runtime here instead —
     see js/dot-field.js — so it can be re-coloured, re-spaced and
     animated. The Figma look is reproduced exactly by the `static`
     style at the shipped defaults.

     Card thumbnails are the exact PNGs exported from the node.
     Font Awesome Pro isn't licensed for this repo, so the node's FA icons
     are inlined as equivalent 24px SVG paths — same glyph, same size. -->
